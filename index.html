<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Noventra Signal</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #070b14;
      --card: #0f1623;
      --card2: #151e2e;
      --text: #e8eef7;
      --muted: #6b7a94;
      --blue: #3b82f6;
      --cyan: #22d3ee;
      --green: #10b981;
      --red: #f43f5e;
      --orange: #f59e0b;
      --border: rgba(59, 130, 246, 0.12);
      --glow: rgba(59, 130, 246, 0.25);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 70px;
      line-height: 1.4;
    }
    .header {
      padding: 16px 14px 10px;
      background: linear-gradient(180deg, #0c1220 0%, var(--bg) 100%);
      position: sticky; top: 0; z-index: 40;
      border-bottom: 1px solid var(--border);
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 11px;
      background: linear-gradient(135deg, #1d4ed8, #7c3aed);
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; box-shadow: 0 0 16px var(--glow);
    }
    .brand h1 {
      font-size: 1.1rem; font-weight: 700; letter-spacing: -0.4px;
      background: linear-gradient(90deg, #e0e7ff, #93c5fd);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .brand span { display: block; font-size: 0.62rem; color: var(--muted); font-weight: 500; }
    .icon-btn {
      width: 34px; height: 34px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--text); font-size: 15px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .icon-btn.spin { animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tabs { display: flex; gap: 4px; background: var(--card); padding: 3px; border-radius: 12px; }
    .tab {
      flex: 1; text-align: center; padding: 8px 2px; border-radius: 9px;
      font-size: 0.72rem; font-weight: 600; color: var(--muted); cursor: pointer;
    }
    .tab.active {
      background: linear-gradient(135deg, #1d4ed8, #3b82f6); color: white;
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.35);
    }
    .filters { display: flex; gap: 6px; padding: 10px 14px 0; overflow-x: auto; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0; padding: 5px 11px; border-radius: 20px; font-size: 0.7rem;
      font-weight: 500; background: var(--card); color: var(--muted);
      border: 1px solid var(--border); cursor: pointer;
    }
    .chip.active { background: rgba(59,130,246,0.18); border-color: #3b82f6; color: #93c5fd; }
    .status-bar { display: flex; justify-content: space-between; padding: 8px 14px 4px; font-size: 0.68rem; color: var(--muted); }
    .list { padding: 4px 12px 16px; display: flex; flex-direction: column; gap: 8px; }
    .card {
      background: var(--card); border-radius: 14px; padding: 12px 13px;
      border: 1px solid var(--border); position: relative;
    }
    .card.fav { border-color: rgba(129,140,248,0.35); }
    .card.alert-hit { border-color: var(--orange); box-shadow: 0 0 12px rgba(245,158,11,0.2); }
    .card-top { display: flex; align-items: center; gap: 9px; }
    .rank {
      width: 22px; height: 22px; border-radius: 7px; background: rgba(255,255,255,0.04);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.68rem; font-weight: 700; color: var(--muted);
    }
    .rank.top { background: rgba(59,130,246,0.2); color: #93c5fd; }
    .info { flex: 1; min-width: 0; }
    .sym-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .symbol { font-weight: 700; font-size: 0.92rem; }
    .dex { font-size: 0.58rem; padding: 1px 5px; border-radius: 4px; font-weight: 600; text-transform: uppercase; }
    .dex.dedust { background: rgba(16,185,129,0.15); color: #6ee7b7; }
    .dex.ston { background: rgba(59,130,246,0.15); color: #93c5fd; }
    .dex.other { background: rgba(255,255,255,0.06); color: var(--muted); }
    .signal { font-size: 0.58rem; font-weight: 700; padding: 2px 5px; border-radius: 4px; }
    .signal.strong-buy { background: rgba(16,185,129,0.22); color: #34d399; }
    .signal.buy { background: rgba(16,185,129,0.12); color: #6ee7b7; }
    .signal.strong-sell { background: rgba(244,63,94,0.22); color: #fb7185; }
    .signal.sell { background: rgba(244,63,94,0.12); color: #fda4af; }
    .meta { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }
    .right { text-align: right; }
    .chg { font-weight: 700; font-size: 1rem; }
    .chg.up { color: var(--green); }
    .chg.down { color: var(--red); }
    .actions { display: flex; gap: 4px; margin-top: 2px; justify-content: flex-end; }
    .act-btn {
      width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--card2); color: var(--muted); font-size: 12px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .act-btn.on { color: #a5b4fc; border-color: #6366f1; background: rgba(99,102,241,0.15); }
    .act-btn.alert-on { color: var(--orange); border-color: var(--orange); }
    .tf-row { display: flex; gap: 5px; margin-top: 8px; }
    .tf { flex: 1; text-align: center; padding: 4px 2px; border-radius: 7px; background: rgba(255,255,255,0.025); font-size: 0.65rem; }
    .tf .lbl { color: var(--muted); font-size: 0.58rem; }
    .tf .v.up { color: var(--green); }
    .tf .v.down { color: var(--red); }
    .tf .v.neu { color: var(--muted); }
    .bar { height: 3px; background: rgba(255,255,255,0.05); border-radius: 2px; margin-top: 7px; overflow: hidden; }
    .bar > div { height: 100%; border-radius: 2px; }

      position: fixed; bottom: 0; left: 0; right: 0; background: #0c1220
