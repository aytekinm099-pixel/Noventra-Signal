<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="description" content="Noventra Signal — TON market intelligence powered by Noventra Guardian AI">
<title>Noventra Signal</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#070b14;
  --card:#0f1623;
  --card2:#151e2e;
  --text:#e8eef7;
  --muted:#71809a;
  --blue:#3b82f6;
  --cyan:#22d3ee;
  --green:#10b981;
  --red:#f43f5e;
  --orange:#f59e0b;
  --purple:#8b5cf6;
  --border:rgba(96,165,250,.13);
  --glow:rgba(59,130,246,.25)
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html{
  background:var(--bg)
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(circle at 50% -20%,rgba(37,99,235,.18),transparent 42%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:82px;
  line-height:1.4
}

button,input,select{
  font:inherit
}

button{
  cursor:pointer
}

.header{
  padding:14px 14px 10px;
  background:linear-gradient(180deg,rgba(10,16,29,.99),rgba(7,11,20,.96));
  position:sticky;
  top:0;
  z-index:40;
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(18px)
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:11px
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0
}

.brand-icon{
  width:40px;
  height:40px;
  border-radius:12px;
  background:linear-gradient(135deg,#1d4ed8,#7c3aed);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  box-shadow:0 0 22px var(--glow);
  flex-shrink:0
}

.brand h1{
  font-size:1.08rem;
  font-weight:800;
  letter-spacing:-.4px;
  background:linear-gradient(90deg,#e0e7ff,#93c5fd);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent
}

.brand span{
  display:block;
  font-size:.61rem;
  color:var(--muted);
  font-weight:500;
  margin-top:1px
}

.guardian-state{
  margin-top:3px;
  font-size:.58rem;
  color:#6ee7b7;
  display:flex;
  align-items:center;
  gap:5px
}

.guardian-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#10b981;
  box-shadow:0 0 9px rgba(16,185,129,.7)
}

.guardian-dot.off{
  background:#f43f5e;
  box-shadow:0 0 9px rgba(244,63,94,.7)
}

.header-actions{
  display:flex;
  gap:5px
}

.icon-btn{
  width:36px;
  height:36px;
  border-radius:11px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  font-size:16px;
  display:flex;
  align-items:center;
  justify-content:center
}

.icon-btn.spin{
  animation:spin .7s linear infinite
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.tabs{
  display:flex;
  gap:4px;
  background:var(--card);
  padding:3px;
  border-radius:12px
}

.tab{
  flex:1;
  text-align:center;
  padding:8px 2px;
  border-radius:9px;
  font-size:.70rem;
  font-weight:650;
  color:var(--muted)
}

.tab.active{
  background:linear-gradient(135deg,#1d4ed8,#3b82f6);
  color:#fff;
  box-shadow:0 2px 12px rgba(37,99,235,.35)
}

.filters{
  display:flex;
  gap:6px;
  padding:10px 14px 0;
  overflow-x:auto;
  scrollbar-width:none
}

.filters::-webkit-scrollbar{
  display:none
}

.chip{
  flex-shrink:0;
  padding:7px 12px;
  border-radius:20px;
  font-size:.69rem;
  font-weight:550;
  background:var(--card);
  color:var(--muted);
  border:1px solid var(--border)
}

.chip.active{
  background:rgba(59,130,246,.18);
  border-color:#3b82f6;
  color:#93c5fd
}

.status-bar{
  display:flex;
  justify-content:space-between;
  padding:8px 14px 4px;
  font-size:.65rem;
  color:var(--muted);
  min-height:27px
}

.alert-banner{
  margin:8px 12px 0;
  padding:10px 12px;
  border-radius:10px;
  background:rgba(245,158,11,.12);
  border:1px solid rgba(245,158,11,.3);
  color:#fbbf24;
  font-size:.76rem;
  display:none
}

.alert-banner.show{
  display:block
}

.page{
  display:none
}

.page.active{
  display:block
}

.list{
  padding:4px 12px 18px;
  display:flex;
  flex-direction:column;
  gap:9px
}

.card{
  background:linear-gradient(145deg,rgba(15,22,35,.98),rgba(12,19,31,.98));
  border-radius:15px;
  padding:13px;
  border:1px solid var(--border);
  overflow:hidden
}

.card.fav{
  border-color:rgba(129,140,248,.4)
}

.card.alert-hit{
  border-color:var(--orange);
  box-shadow:0 0 15px rgba(245,158,11,.16)
}

.card-top{
  display:flex;
  align-items:center;
  gap:9px
}

.rank{
  width:27px;
  height:27px;
  border-radius:8px;
  background:rgba(255,255,255,.045);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:.68rem;
  font-weight:750;
  color:var(--muted);
  flex-shrink:0
}

.rank.top{
  background:rgba(59,130,246,.20);
  color:#93c5fd
}

.info{
  flex:1;
  min-width:0
}

.sym-row{
  display:flex;
  align-items:center;
  gap:5px;
  flex-wrap:wrap
}

.token-title{
  display:flex;
  align-items:baseline;
  gap:5px;
  min-width:0;
  max-width:100%
}

.token-name{
  font-weight:750;
  font-size:.91rem;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  max-width:155px
}

.token-symbol{
  font-size:.62rem;
  font-weight:650;
  color:var(--muted);
  white-space:nowrap
}

.dex{
  font-size:.56rem;
  padding:2px 5px;
  border-radius:5px;
  font-weight:650;
  text-transform:uppercase
}

.dex.dedust{
  background:rgba(16,185,129,.15);
  color:#6ee7b7
}

.dex.ston{
  background:rgba(59,130,246,.15);
  color:#93c5fd
}

.dex.other{
  background:rgba(255,255,255,.06);
  color:var(--muted)
}

.signal{
  font-size:.55rem;
  font-weight:750;
  padding:2px 5px;
  border-radius:5px
}

.signal.strong-buy,
.signal.buy{
  background:rgba(16,185,129,.16);
  color:#34d399
}

.signal.strong-sell,
.signal.sell{
  background:rgba(244,63,94,.16);
  color:#fb7185
}

.meta{
  font-size:.62rem;
  color:var(--muted);
  margin-top:3px
}

.right{
  text-align:right;
  min-width:92px
}

.chg{
  font-weight:750;
  font-size:.97rem
}

.chg.up{
  color:var(--green)
}

.chg.down{
  color:var(--red)
}

.actions{
  display:flex;
  gap:4px;
  margin-top:4px;
  justify-content:flex-end
}

.act-btn{
  width:29px;
  height:29px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--card2);
  color:var(--muted);
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:center
}

.act-btn.on{
  color:#a5b4fc;
  border-color:#6366f1;
  background:rgba(99,102,241,.15)
}

.act-btn.alert-on{
  color:var(--orange);
  border-color:var(--orange);
  background:rgba(245,158,11,.08)
}

.act-btn.ai{
  color:#c4b5fd
}

.tf-row{
  display:flex;
  gap:5px;
  margin-top:10px
}

.tf{
  flex:1;
  text-align:center;
  padding:6px 2px;
  border-radius:8px;
  background:rgba(255,255,255,.025);
  font-size:.64rem
}

.tf .lbl{
  color:var(--muted);
  font-size:.56rem;
  margin-bottom:1px
}

.tf .v.up{
  color:var(--green)
}

.tf .v.down{
  color:var(--red)
}

.tf .v.neu{
  color:var(--muted)
}

.score-row{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  font-size:.55rem;
  color:var(--muted)
}

.score-value{
  color:#93c5fd;
  font-weight:700
}

.bar{
  height:3px;
  background:rgba(255,255,255,.05);
  border-radius:2px;
  margin-top:4px;
  overflow:hidden
}

.bar>div{
  height:100%;
  border-radius:2px
}

.ai-mini{
  margin-top:10px;
  padding:8px 9px;
  border-radius:9px;
  background:linear-gradient(90deg,rgba(139,92,246,.10),rgba(59,130,246,.06));
  border:1px solid rgba(139,92,246,.15);
  font-size:.61rem;
  color:#b8c5da;
  display:flex;
  gap:7px;
  align-items:flex-start
}

.ai-mini b{
  color:#c4b5fd
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(9,15,27,.98);
  border-top:1px solid var(--border);
  display:flex;
  z-index:50;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  backdrop-filter:blur(18px)
}

.nav-item{
  flex:1;
  text-align:center;
  padding:6px 2px;
  font-size:.64rem;
  color:var(--muted)
}

.nav-item.active{
  color:#93c5fd
}

.nav-item .ico{
  font-size:17px;
  display:block;
  margin-bottom:2px
}

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.76);
  z-index:100;
  display:none;
  align-items:flex-end;
  justify-content:center
}

.modal-bg.show{
  display:flex
}

.modal{
  background:#111827;
  width:100%;
  max-width:470px;
  border-radius:19px 19px 0 0;
  padding:18px 16px 30px;
  border-top:1px solid var(--border);
  max-height:90vh;
  overflow-y:auto
}

.modal.ai-modal{
  max-height:94vh
}

.modal h3{
  font-size:1rem;
  margin-bottom:12px;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.ai-head{
  display:flex;
  align-items:center;
  gap:9px
}

.ai-orb{
  width:35px;
  height:35px;
  border-radius:11px;
  background:linear-gradient(135deg,#7c3aed,#2563eb);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 20px rgba(124,58,237,.3)
}

.ai-status{
  font-size:.58rem;
  color:#6ee7b7;
  margin-top:2px
}

.ai-body{
  font-size:.82rem;
  line-height:1.55;
  color:#dbe4f5
}

.ai-loading{
  padding:30px 5px;
  text-align:center;
  color:var(--muted)
}

.ai-loader{
  width:28px;
  height:28px;
  margin:0 auto 12px;
  border:2px solid rgba(255,255,255,.08);
  border-top-color:#8b5cf6;
  border-radius:50%;
  animation:spin .8s linear infinite
}

.ai-headline{
  padding:12px;
  border-radius:12px;
  background:linear-gradient(135deg,rgba(59,130,246,.12),rgba(139,92,246,.09));
  border:1px solid rgba(99,102,241,.18);
  margin-bottom:11px
}

.ai-signal{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:5px
}

.ai-signal strong{
  font-size:1.05rem
}

.ai-confidence{
  font-size:.65rem;
  color:#93c5fd
}

.ai-section{
  margin-top:11px;
  padding:11px;
  border-radius:11px;
  background:rgba(255,255,255,.025);
  border:1px solid rgba(255,255,255,.045)
}

.ai-section-title{
  font-size:.67rem;
  text-transform:uppercase;
  letter-spacing:.4px;
  color:#93c5fd;
  font-weight:750;
  margin-bottom:6px
}

.ai-section p{
  margin:3px 0;
  color:#c8d3e5
}

.ai-list{
  padding-left:17px;
  color:#c8d3e5
}

.ai-list li{
  margin:4px 0
}

.ai-good{
  color:#34d399!important
}

.ai-bad{
  color:#fb7185!important
}

.ai-warn{
  color:#fbbf24!important
}

.ai-action{
  font-weight:800;
  color:#c4b5fd
}

.modal label{
  display:block;
  font-size:.74rem;
  color:var(--muted);
  margin-bottom:5px;
  margin-top:10px
}

.modal input,
.modal select{
  width:100%;
  padding:11px 12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  font-size:.94rem;
  outline:none
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:16px
}

.btn{
  flex:1;
  padding:12px;
  border-radius:11px;
  font-weight:650;
  font-size:.88rem;
  cursor:pointer;
  border:none
}

.btn-primary{
  background:linear-gradient(135deg,#1d4ed8,#3b82f6);
  color:#fff
}

.btn-ghost{
  background:var(--card);
  color:var(--muted);
  border:1px solid var(--border)
}

.btn-danger{
  background:rgba(244,63,94,.15);
  color:#fb7185;
  border:1px solid rgba(244,63,94,.3)
}

.empty,
.loading{
  text-align:center;
  padding:48px 20px;
  color:var(--muted);
  font-size:.86rem
}

.loader{
  width:25px;
  height:25px;
  margin:0 auto 10px;
  border:2px solid rgba(255,255,255,.08);
  border-top-color:var(--blue);
  border-radius:50%;
  animation:spin .8s linear infinite
}

.fav-empty{
  text-align:center;
  padding:42px 20px;
  color:var(--muted)
}

.fav-empty .big{
  font-size:2rem;
  margin-bottom:8px
}

.language-menu{
  position:fixed;
  top:65px;
  right:10px;
  z-index:200;
  width:190px;
  background:#111827;
  border:1px solid rgba(59,130,246,.25);
  border-radius:14px;
  padding:7px;
  box-shadow:0 15px 40px rgba(0,0,0,.45);
  backdrop-filter:blur(18px)
}

.language-menu button{
  width:100%;
  border:0;
  background:transparent;
  color:#e8eef7;
  border-radius:9px;
  padding:10px;
  text-align:left;
  font-size:.82rem
}

.language-menu button.active{
  background:rgba(59,130,246,.20)
}

.ai-error{
  padding:13px;
  border-radius:11px;
  background:rgba(244,63,94,.08);
  border:1px solid rgba(244,63,94,.22);
  color:#fda4af;
  font-size:.76rem
}

.guardian-box{
  padding:11px;
  border-radius:11px;
  background:rgba(16,185,129,.06);
  border:1px solid rgba(16,185,129,.14);
  margin-bottom:11px;
  font-size:.72rem
}

.guardian-box strong{
  color:#6ee7b7
}

@media(max-width:380px){
  .token-name{
    max-width:125px
  }

  .right{
    min-width:84px
  }

  .act-btn{
    width:27px;
    height:27px
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="header-top">

    <div class="brand">

      <div class="brand-icon">◈</div>

      <div>
        <h1>Noventra Signal</h1>
        <span>TON · Guardian Gateway · AI Signals</span>

        <div class="guardian-state">
          <span class="guardian-dot" id="guardianDot"></span>
          <span id="guardianStateText">GUARDIAN</span>
        </div>
      </div>

    </div>

    <div class="header-actions">

      <button class="icon-btn" id="languageBtn">
        🌐
      </button>

      <button class="icon-btn" id="refreshBtn">
        ↻
      </button>

    </div>

  </div>

  <div class="tabs" id="mainTabs">

    <div class="tab active" data-tab="gainers">
      Gainers
    </div>

    <div class="tab" data-tab="losers">
      Losers
    </div>

    <div class="tab" data-tab="volume">
      Volume
    </div>

    <div class="tab" data-tab="signals">
      Signals
    </div>

  </div>

</header>

<div class="alert-banner" id="alertBanner"></div>

<div class="filters" id="filters">

  <div class="chip active" data-tf="h1">
    1 Hour
  </div>

  <div class="chip" data-tf="h6">
    6 Hours
  </div>

  <div class="chip" data-tf="h24">
    24 Hours
  </div>

  <div class="chip active" data-vol="all">
    All
  </div>

  <div class="chip" data-vol="high">
    High Volume
  </div>

  <div class="chip" data-vol="dedust">
    DeDust
  </div>

</div>

<div class="status-bar">

  <span id="statusText">
    Preparing...
  </span>

  <span id="countText"></span>

</div>

<section class="page active" id="page-market">

  <div id="content">

    <div class="loading">

      <div class="loader"></div>

      <span id="loadingText">
        Connecting to Noventra Guardian...
      </span>

    </div>

  </div>

</section>

<section class="page" id="page-favorites">

  <div id="favContent"></div>

</section>

<section class="page" id="page-alerts">

  <div id="alertContent"></div>

</section>

<nav class="bottom-nav">

  <div class="nav-item active" data-page="market">
    <span class="ico">📊</span>
    <span>Market</span>
  </div>

  <div class="nav-item" data-page="favorites">
    <span class="ico">★</span>
    <span>Favorites</span>
  </div>

  <div class="nav-item" data-page="alerts">
    <span class="ico">🔔</span>
    <span>Alerts</span>
  </div>

</nav>

<!-- ALERT MODAL -->

<div class="modal-bg" id="alertModal">

  <div class="modal">

    <h3>
      <span>Set Alert</span>

      <span
        id="modalClose"
        style="font-size:1.2rem;cursor:pointer;color:var(--muted)"
      >
        ✕
      </span>

    </h3>

    <div
      id="modalSymbol"
      style="font-size:.85rem;color:var(--cyan);margin-bottom:8px"
    ></div>

    <label>
      Alert Type
    </label>

    <select id="alertType">

      <option value="pct_up">
        When percentage rises (%)
      </option>

      <option value="pct_down">
        When percentage falls (%)
      </option>

      <option value="price_above">
        When price rises above ($)
      </option>

      <option value="price_below">
        When price falls below ($)
      </option>

    </select>

    <label>
      Value
    </label>

    <input
      type="number"
      id="alertValue"
      placeholder="e.g. 10 or 0.05"
      step="any"
      inputmode="decimal"
    >

    <div class="modal-actions">

      <button
        class="btn btn-ghost"
        id="modalCancel"
      >
        Cancel
      </button>

      <button
        class="btn btn-primary"
        id="modalSave"
      >
        Save
      </button>

    </div>

  </div>

</div>

<!-- AI MODAL -->

<div class="modal-bg" id="aiModal">

  <div class="modal ai-modal">

    <h3>

      <div class="ai-head">

        <div class="ai-orb">
          ✦
        </div>

        <div>

          <div>
            Noventra Guardian AI
          </div>

          <div class="ai-status">
            Gemini Intelligence · TON
          </div>

        </div>

      </div>

      <span
        id="aiModalClose"
        style="font-size:1.2rem;cursor:pointer;color:var(--muted)"
      >
        ✕
      </span>

    </h3>

    <div id="aiBody"></div>

    <div class="modal-actions">

      <button
        class="btn btn-primary"
        id="aiModalOk"
      >
        Close
      </button>

    </div>

  </div>

</div>

<script>
"use strict";

/* =========================================================
   TELEGRAM
========================================================= */

const tg =
  window.Telegram?.WebApp || null;

if(tg){

  try{

    tg.ready();
    tg.expand();

    const p =
      tg.themeParams || {};

    if(p.bg_color)
      document.documentElement.style.setProperty(
        "--bg",
        p.bg_color
      );

    if(p.secondary_bg_color)
      document.documentElement.style.setProperty(
        "--card",
        p.secondary_bg_color
      );

    if(p.text_color)
      document.documentElement.style.setProperty(
        "--text",

function detectLanguage(){

  try{

    const saved =
      localStorage.getItem(
        LANG_KEY
      );

    if(
      saved &&
      LANGUAGES[saved]
    ){
      return saved;
    }

    const code =
      (
        tg?.initDataUnsafe?.user?.language_code ||
        navigator.language ||
        "en"
      )
      .toLowerCase()
      .split("-")[0];

    return LANGUAGES[code]
      ? code
      : "en";

  }catch(_){

    return "en";

  }

}

const esc =
  v =>
    String(v ?? "")
      .replace(
        /[&<>"']/g,
        m => ({
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[m])
      );

const escJS =

      );

function fmtPct(v){

  v =
    Number(v || 0);

  if(
    Math.abs(v) < .05
  ){
    return "0.0%";
  }

  return (
    v > 0 ? "+" : ""
  ) +
  v.toFixed(1) +
  "%";

}

function fmtMoney(v){

  v =
    Number(v || 0);

  if(v >= 1e9)
    return "$"+(v/1e9).toFixed(1)+"B";

  if(v >= 1e6)
    return "$"+(v/1e6).toFixed(1)+"M";

  if(v >= 1e3)
    return "$"+(v/1e3).toFixed(1)+"K";

  return "$"+Math.round(v);

}

function formatPrice(v){

  v =
    Number(v || 0);

  if(!v)
    return "0";

  if(v < 1e-9)
    return v.toExponential(2);

  if(v < 1e-6)
    return v.toExponential(2);

  if(v < .01)
    return v.toFixed(7);

  if(v < 1)
    return v.toFixed(5);

  if(v < 100)
    return v.toFixed(3);

  return v.toFixed(2);

}

function cls(v){

  return v > .25
    ? "up"
    : v < -.25
      ? "down"
      : "neu";

async function apiGet(
  endpoint,
  timeout=12000
){

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      () => controller.abort(),
      timeout
    );

  try{

    const r =
      await fetch(
        endpoint,
        {
          method:"GET",
          cache:"no-store",
          headers:{
            "Accept":
              "application/json"
          },
          signal:
            controller.signal
        }
      );

    const text =
      await r.text();

    let data;

    try{
      data =
        JSON.parse(text);
    }catch{
      data =
        {
          ok:false,
          error:text
        };
    }

    if(!r.ok){

      throw new Error(
        data?.error ||
        "HTTP "+r.status
      );

    }

    return data;

  }finally{

    clearTimeout(timer);

  }

}

async function apiPost(
  endpoint,
  body,
  timeout=30000
){

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      () => controller.abort(),
      timeout
    );

  try{

    const r =
      await fetch(
        endpoint,
        {
          method:"POST",
          cache:"no-store",
          headers:{
            "Content-Type":
              "application/json",
            "Accept":
              "application/json"
          },
          body:
            JSON.stringify(body),
          signal:
            controller.signal
        }
      );

    const text =
      await r.text();

    let data;

    try{
      data =
        JSON.parse(text);
    }catch{
      data =
        {
          ok:false,
          error:text
        };
    }

    if(!r.ok){

      throw new Error(
        data?.error ||
        "HTTP "+r.status
      );

    }

    return data;

  }finally{

    clearTimeout(timer);

  }

}

async function fetchGuardian(
  tokenAddress
){

  if(!tokenAddress)
    return null;

  try{

    /*
      Known Guardian endpoint:
      /api/holders?address=...
    */

    const url =
      GUARDIAN_API +
      "/holders?address=" +
      encodeURIComponent(
        tokenAddress
      );

    return await apiGet(
      url,
      15000
    );

  }catch(e){

    console.warn(
      "Guardian holders:",
      e
    );

    return null;

  }

}

async function openAIAnalysis(
  address
){

  const pair =
    pairs.find(
      p =>
        p.pairAddress ===
        address
    );

  if(!pair){

    showAlert(
      "Token data not found."
    );

    return;

  }

  const modal =
    document.getElementById(
      "aiModal"
    );

  const body =
    document.getElementById(
      "aiBody"
    );

  modal.classList.add(
    "show"
  );

  body.innerHTML = `

    <div class="ai-loading">

      <div class="ai-loader"></div>

      <strong>
        ${t("loadingAI")}
      </strong>

      <br>

      <span>
        ${t("aiConnection")}
      </span>

      <div
        style="
          margin-top:12px;
          font-size:.62rem;
          color:var(--muted)
        "
      >
        ${esc(
          pair.baseName
        )}
        ·
        ${esc(
          pair.baseSymbol
        )}
      </div>

    </div>

  `;

  if(aiLoading)
    return;

  aiLoading = true;

  try{

    const guardian =
      await fetchGuardian(
        pair.baseAddress
      );

    const result =
      await requestAI(
        pair
      );

    if(
      !result ||
      result.ok === false
    ){

      throw new Error(
        result?.error ||
        "AI endpoint failed"
      );

    }

    renderAI(
      result,
      pair,
      guardian
    );

  }catch(e){

    console.error(
      "Guardian AI:",
      e
    );

    body.innerHTML = `

      <div class="ai-error">

        <strong>
          ${t("aiError")}
        </strong>

        <br><br>

        ${esc(
          e?.message ||
          "Unknown error"
        )}

      </div>

    `;

  }finally{

    aiLoading = false;

  }

}

async function loadMarket(){

  isLoading = true;

  document
    .getElementById(
      "refreshBtn"
    )
    .classList.add(
      "spin"
    );

  setStatus(
    t("scanning")
  );

  try{

    const data =
      await apiGet(
        SIGNAL_API +
        "/api/market",
        30000
      );

    if(
      !data ||
      data.ok === false
    ){

      throw new Error(
        data?.error ||
        "Market API failed"
      );

    }

    pairs =
      Array.isArray(
        data.pairs
      )
        ? data.pairs
        : [];

    document.getElementById(
      "countText"

      t("updated") +

function getFiltered(){

  let list =
    [...pairs];

  if(
    volFilter ===
    "high"
  ){

    list =
      list.filter(
        p =>
          Number(
            p.volume?.h24 ||
            0
          ) >= 20000
      );

  }

  if(
    volFilter ===
    "dedust"
  ){

    list =
      list.filter(
        p =>
          p.isDedust
      );

  }

  if(
    currentTab ===
    "gainers"
  ){

    list =
      list
        .filter(
          p =>
            Number(
              p.change?.[
                currentTf
              ] || 0
            ) > 1
        )
        .sort(
          (a,b) =>
            Number(
              b.change?.[
                currentTf
              ] || 0
            ) -
            Number(
              a.change?.[
                currentTf
              ] || 0
            )
        );

  }

  else if(
    currentTab ===
    "losers"
  ){

    list =
      list
        .filter(
          p =>
            Number(
              p.change?.[
                currentTf
              ] || 0
            ) < -1
        )
        .sort(
          (a,b) =>
            Number(
              a.change?.[
                currentTf
              ] || 0
            ) -
            Number(
              b.change?.[
                currentTf
              ] || 0
            )
        );

  }

  else if(
    currentTab ===
    "volume"
  ){

    list.sort(
      (a,b) =>
        Number(
          b.volume?.h24 ||
          0
        ) -
        Number(
          a.volume?.h24 ||
          0
        )
    );

  }

  else{

    const order = {

      "strong-buy":0,

      "buy":1,

      "strong-sell":2,

      "sell":3,

      "neutral":9

    };

    list =
      list
        .filter(
          p =>
            p.signal !==
            "neutral"
        )
        .sort(
          (a,b) =>
            (
              order[a.signal] -
              order[b.signal]
            ) ||
            (
              Math.abs(
                Number(
                  b.score ||
                  0
                )
              ) -
              Math.abs(
                Number(
                  a.score ||
                  0
                )
              )
            )
        );

  }

  return list.slice(
    0,
    150
  );

}

function closeAlertModal(){

  document.getElementById(
    "alertModal"
  ).classList.remove(
    "show"
  );

  alertTarget =
    null;

}

function saveAlert(){

  if(!alertTarget)
    return;

  const type =
    document.getElementById(
      "alertType"
    ).value;

  const value =
    parseFloat(
      document.getElementById(
        "alertValue"
      ).value
    );

  if(
    !Number.isFinite(value) ||
    value <= 0
  ){

    showAlert(
      t("invalidValue")
    );

    return;

  }

  alerts =
    alerts.filter(
      a =>
        !(
          a.pairAddress ===
          alertTarget.pairAddress &&
          a.type ===
          type
        )
    );

  alerts.push({

    id:
      Date.now().toString(
        36
      ),

    pairAddress:
      alertTarget.pairAddress,

    symbol:
      alertTarget.baseToken?.symbol ||
      alertTarget.baseSymbol,

    name:
      alertTarget.baseToken?.name ||
      alertTarget.baseName,

    type,

    value,

    url:
      alertTarget.url,

    created:
      Date.now()

  });

  saveJSON(
    ALERT_KEY,
    alerts
  );

  const sym =
    alertTarget.baseToken?.symbol ||
    alertTarget.baseSymbol;

  closeAlertModal();

  render();
  renderAlertsPage();

  showPopup(
    t("alertSaved"),
    `${sym} ${t("alertCreated")}.`
  );

}

function removeAlert(
  id
){

  alerts =
    alerts.filter(
      a =>
        a.id !==
        id
    );

  saveJSON(
    ALERT_KEY,
    alerts
  );

  renderAlertsPage();
  render();
  checkAlerts();

}

window.removeAlert =
  removeAlert;

function checkAlerts(){

  const hits = [];

  for(
    const a of alerts
  ){

    const p =
      pairs.find(
        x =>
          x.pairAddress ===
          a.pairAddress
      );

    if(!p)
      continue;

    const hit =

      (
        a.type ===
        "pct_up" &&
        p.change.h1 >=
        a.value
      )

      ||

      (
        a.type ===
        "pct_down" &&
        p.change.h1 <=
        -a.value
      )

      ||

      (
        a.type ===
        "price_above" &&
        p.priceUsd >=
        a.value
      )

      ||

      (
        a.type ===
        "price_below" &&
        p.priceUsd <=
        a.value
      );

    if(hit)
      hits.push(a);

  }

  const banner =
    document.getElementById(
      "alertBanner"
    );

  if(!hits.length){

    banner.classList.remove(
      "show"
    );

    return;

  }

  banner.innerHTML =
    hits
      .map(
        a =>
          "🔔 <b>" +
          esc(a.symbol) +
          "</b> " +
          t("triggered")
      )
      .join("<br>");

  banner.classList.add(
    "show"
  );

  try{

    tg?.HapticFeedback
      ?.notificationOccurred(
        "warning"
      );

  }catch(_){}

}

/* =========================================================
   PAIR
========================================================= */

function openPair(
  url
){

  if(!url)
    return;

  try{

    if(
      tg?.openLink
    ){

      tg.openLink(
        url,
        {
          try_instant_view:false
        }
      );

    }else{

      window.open(
        url,
        "_blank",
        "noopener,noreferrer"
      );

    }

  }catch(_){

    window.open(
      url,
      "_blank"
    );

  }

}

window.openPair =
  openPair;

/* =========================================================
   POPUPS
========================================================= */

function showAlert(
  message
){

  try{

    tg?.showAlert
      ? tg.showAlert(
          message
        )
      : alert(
          message
        );

  }catch(_){

    alert(
      message
    );

  }

}

function showPopup(
  title,
  message
){

  try{

    if(tg?.showPopup){

      tg.showPopup({

        title,

        message,

        buttons:[
          {
            type:"ok"
          }
        ]

      });

    }else{

      alert(
        title +
        "\n\n" +
        message
      );

    }

  }catch(_){

    alert(
      title +
      "\n\n" +
      message
    );

  }

}

/* =========================================================
   LANGUAGE
========================================================= */

function setLanguage(
  lang
){

  if(
    !LANGUAGES[lang]
  )
    return;

  currentLanguage =
    lang;

  try{

    localStorage.setItem(
      LANG_KEY,
      lang
    );

  }catch(_){}

  document.documentElement
    .lang =
    lang;

  applyLanguage();

  render();
  renderFavorites();
  renderAlertsPage();

}

function applyLanguage(){

  document.querySelectorAll(
    ".tab"
  ).forEach(
    el => {

      const map = {

        gainers:
          t("gainers"),

        losers:
          t("losers"),

        volume:
          t("volume"),

        signals:
          t("signals")

      };

      el.textContent =
        map[
          el.dataset.tab
        ];

    }
  );

  document.querySelectorAll(
    ".nav-item"
  ).forEach(
    el => {

      const page =
        el.dataset.page;

      const map = {

        market:
          t("market"),

        favorites:
          t("favorites"),

        alerts:
          t("alerts")

      };

      const spans =
        el.querySelectorAll(
          "span"
        );

      if(
        spans[1]
      ){
        spans[1].textContent =
          map[page] ||
          page;
      }

    }
  );

  document.querySelectorAll(
    ".chip"
  ).forEach(
    el => {

      if(
        el.dataset.tf ===
        "h1"
      )
        el.textContent =
          currentLanguage ===
          "tr"
            ? "1 Saat"
            : "1 Hour";

      if(
        el.dataset.tf ===
        "h6"
      )
        el.textContent =
          currentLanguage ===
          "tr"
            ? "6 Saat"
            : "6 Hours";

      if(
        el.dataset.tf ===
        "h24"
      )
        el.textContent =
          currentLanguage ===
          "tr"
            ? "24 Saat"
            : "24 Hours";

      if(
        el.dataset.vol ===
        "all"
      )
        el.textContent =
          currentLanguage ===
          "tr"
            ? "Tüm"
            : "All";

      if(
        el.dataset.vol ===
        "high"
      )
        el.textContent =
          currentLanguage ===
          "tr"
            ? "Yüksek Hacim"
            : "High Volume";

      if(
        el.dataset.vol ===
        "dedust"
      )
        el.textContent =
          "DeDust";

    }
  );

  document.getElementById(
    "guardianStateText"
  ).textContent =
    t("guardian");

}

/* =========================================================
   LANGUAGE MENU
========================================================= */

function openLanguageMenu(){

  let menu =
    document.getElementById(
      "languageMenu"
    );

  if(menu){

    menu.remove();
    return;

  }

  menu =
    document.createElement(
      "div"
    );

  menu.id =
    "languageMenu";

  menu.className =
    "language-menu";

  Object.entries(
    LANGUAGES
  ).forEach(
    ([code,name]) => {

      const b =
        document.createElement(
          "button"
        );

      b.textContent =
        name;

      if(
        code ===
        currentLanguage
      ){

        b.classList.add(
          "active"
        );

      }

      b.onclick =
        () => {

          setLanguage(
            code
          );

          menu.remove();

        };

      menu.appendChild(
        b
      );

    }
  );

  document.body.appendChild(
    menu
  );

}

document.getElementById(
  "languageBtn"
).onclick =
  openLanguageMenu;

document.addEventListener(
  "click",
  e => {

    const menu =
      document.getElementById(
        "languageMenu"
      );

    if(
      menu &&
      !menu.contains(
        e.target
      ) &&
      e.target.id !==
      "languageBtn"
    ){

      menu.remove();

    }

  }
);

/* =========================================================
   EVENTS
========================================================= */

document.querySelectorAll(
  "#mainTabs .tab"
).forEach(
  tab => {

    tab.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(
            "#mainTabs .tab"
          )
          .forEach(
            x =>
              x.classList.remove(
                "active"
              )
          );

        tab.classList.add(
          "active"
        );

        currentTab =
          tab.dataset.tab;

        render();

      }
    );

  }
);

document.querySelectorAll(
  ".chip"
).forEach(
  chip => {

    chip.addEventListener(
      "click",
      () => {

        if(
          chip.dataset.tf
        ){

          document
            .querySelectorAll(
              "[data-tf]"
            )
            .forEach(
              x =>
                x.classList.remove(
                  "active"
                )
            );

          chip.classList.add(
            "active"
          );

          currentTf =
            chip.dataset.tf;

        }

        if(
          chip.dataset.vol
        ){

          document
            .querySelectorAll(
              "[data-vol]"
            )
            .forEach(
              x =>
                x.classList.remove(
                  "active"
                )
            );

          chip.classList.add(
            "active"
          );

          volFilter =
            chip.dataset.vol;

        }

        render();

      }
    );

  }
);

document.querySelectorAll(
  ".nav-item"
).forEach(
  item => {

    item.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(
            ".nav-item"
          )
          .forEach(
            x =>
              x.classList.remove(
                "active"
              )
          );

        item.classList.add(
          "active"
        );

        currentPage =
          item.dataset.page;

        document
          .querySelectorAll(
            ".page"
          )
          .forEach(
            x =>
              x.classList.remove(
                "active"
              )
          );

        document
          .getElementById(
            "page-" +
            currentPage
          )
          .classList.add(
            "active"
          );

        const market =
          currentPage ===
          "market";

        document.getElementById(
          "filters"
        ).style.display =
          market
            ? "flex"
            : "none";

        document.getElementById(
          "mainTabs"
        ).style.display =
          market
            ? "flex"
            : "none";

        if(
          currentPage ===
          "favorites"
        )
          renderFavorites();

        if(
          currentPage ===
          "alerts"
        )
          renderAlertsPage();

        if(
          market
        )
          render();

      }
    );

  }
);

document.getElementById(
  "refreshBtn"
).onclick =
  loadMarket;

document.getElementById(
  "modalClose"
).onclick =
  closeAlertModal;

document.getElementById(
  "modalCancel"
).onclick =
  closeAlertModal;

document.getElementById(
  "modalSave"
).onclick =
  saveAlert;

document.getElementById(
  "alertModal"
).onclick =
  e => {

    if(
      e.target.id ===
      "alertModal"
    ){

      closeAlertModal();

    }

  };

document.getElementById(
  "aiModalClose"
).onclick =
  () =>
    document
      .getElementById(
        "aiModal"
      )
      .classList.remove(
        "show"
      );

document.getElementById(
  "aiModalOk"
).onclick =
  () =>
    document
      .getElementById(
        "aiModal"
      )
      .classList.remove(
        "show"
      );

document.getElementById(
  "aiModal"
).onclick =
  e => {

    if(
      e.target.id ===
      "aiModal"
    ){

      document
        .getElementById(
          "aiModal"
        )
        .classList.remove(
          "show"
        );

    }

  };

/* =========================================================
   START
========================================================= */

document.documentElement
  .lang =
  currentLanguage;

applyLanguage();

loadMarket();

/*
 Refresh every 60 seconds.
*/

setInterval(
  () => {

    if(
      !isLoading &&
      currentPage ===
      "market"
    ){

      loadMarket();

    }

  },
  60000
);

</script>
