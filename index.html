<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Noventra Signal</title>

<style>
:root{
  --bg:#070b14;--card:#0f1623;--card2:#151e2e;--text:#e8eef7;--muted:#6b7a94;
  --blue:#3b82f6;--cyan:#22d3ee;--green:#10b981;--red:#f43f5e;--orange:#f59e0b;
  --border:rgba(59,130,246,.12);--glow:rgba(59,130,246,.25)
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
background:radial-gradient(circle at 50% -20%,rgba(37,99,235,.16),transparent 42%),var(--bg);
color:var(--text);min-height:100vh;padding-bottom:78px;line-height:1.4}
button,input,select{font:inherit}
button{cursor:pointer}
.header{padding:14px 14px 10px;background:linear-gradient(180deg,rgba(12,18,32,.99),rgba(7,11,20,.96));
position:sticky;top:0;z-index:40;border-bottom:1px solid var(--border);backdrop-filter:blur(18px)}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-icon{width:39px;height:39px;border-radius:12px;background:linear-gradient(135deg,#1d4ed8,#7c3aed);
display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 0 20px var(--glow);flex-shrink:0}
.brand h1{font-size:1.08rem;font-weight:800;letter-spacing:-.4px;background:linear-gradient(90deg,#e0e7ff,#93c5fd);
-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand span{display:block;font-size:.61rem;color:var(--muted);font-weight:500;margin-top:1px}
.header-actions{display:flex;gap:5px}
.icon-btn{width:35px;height:35px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);
font-size:16px;display:flex;align-items:center;justify-content:center}
.icon-btn.spin{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:4px;background:var(--card);padding:3px;border-radius:12px}
.tab{flex:1;text-align:center;padding:8px 2px;border-radius:9px;font-size:.70rem;font-weight:650;color:var(--muted)}
.tab.active{background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;box-shadow:0 2px 12px rgba(37,99,235,.35)}
.filters{display:flex;gap:6px;padding:10px 14px 0;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 11px;border-radius:20px;font-size:.69rem;font-weight:550;background:var(--card);
color:var(--muted);border:1px solid var(--border)}
.chip.active{background:rgba(59,130,246,.18);border-color:#3b82f6;color:#93c5fd}
.status-bar{display:flex;justify-content:space-between;padding:8px 14px 4px;font-size:.65rem;color:var(--muted)}
.alert-banner{margin:8px 12px 0;padding:10px 12px;border-radius:10px;background:rgba(245,158,11,.12);
border:1px solid rgba(245,158,11,.3);color:#fbbf24;font-size:.76rem;display:none}
.alert-banner.show{display:block}
.page{display:none}.page.active{display:block}
.list{padding:4px 12px 18px;display:flex;flex-direction:column;gap:8px}
.card{background:linear-gradient(145deg,rgba(15,22,35,.98),rgba(12,19,31,.98));border-radius:14px;padding:12px 13px;border:1px solid var(--border)}
.card.fav{border-color:rgba(129,140,248,.38)}.card.alert-hit{border-color:var(--orange);box-shadow:0 0 14px rgba(245,158,11,.18)}
.card-top{display:flex;align-items:center;gap:9px}.rank{width:23px;height:23px;border-radius:7px;background:rgba(255,255,255,.04);
display:flex;align-items:center;justify-content:center;font-size:.67rem;font-weight:750;color:var(--muted);flex-shrink:0}
.rank.top{background:rgba(59,130,246,.2);color:#93c5fd}.info{flex:1;min-width:0}.sym-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.token-title{display:flex;align-items:baseline;gap:5px;min-width:0;max-width:100%}
.token-name{font-weight:750;font-size:.91rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:155px}
.token-symbol{font-size:.62rem;font-weight:650;color:var(--muted);white-space:nowrap}
.dex{font-size:.56rem;padding:1px 5px;border-radius:4px;font-weight:650;text-transform:uppercase}
.dex.dedust{background:rgba(16,185,129,.15);color:#6ee7b7}.dex.ston{background:rgba(59,130,246,.15);color:#93c5fd}
.dex.other{background:rgba(255,255,255,.06);color:var(--muted)}
.signal{font-size:.55rem;font-weight:750;padding:2px 5px;border-radius:4px}
.signal.strong-buy,.signal.buy{background:rgba(16,185,129,.16);color:#34d399}
.signal.strong-sell,.signal.sell{background:rgba(244,63,94,.16);color:#fb7185}
.meta{font-size:.62rem;color:var(--muted);margin-top:3px}.right{text-align:right;min-width:88px}
.chg{font-weight:750;font-size:.97rem}.chg.up{color:var(--green)}.chg.down{color:var(--red)}
.actions{display:flex;gap:4px;margin-top:3px;justify-content:flex-end}.act-btn{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);
background:var(--card2);color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center}
.act-btn.on{color:#a5b4fc;border-color:#6366f1;background:rgba(99,102,241,.15)}
.act-btn.alert-on{color:var(--orange);border-color:var(--orange);background:rgba(245,158,11,.08)}
.tf-row{display:flex;gap:5px;margin-top:9px}.tf{flex:1;text-align:center;padding:5px 2px;border-radius:7px;background:rgba(255,255,255,.025);font-size:.64rem}
.tf .lbl{color:var(--muted);font-size:.56rem;margin-bottom:1px}.tf .v.up{color:var(--green)}.tf .v.down{color:var(--red)}.tf .v.neu{color:var(--muted)}
.score-row{display:flex;justify-content:space-between;margin-top:7px;font-size:.55rem;color:var(--muted)}
.score-value{color:#93c5fd;font-weight:700}.bar{height:3px;background:rgba(255,255,255,.05);border-radius:2px;margin-top:3px;overflow:hidden}
.bar>div{height:100%;border-radius:2px}.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(12,18,32,.97);
border-top:1px solid var(--border);display:flex;z-index:50;padding:6px 8px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(18px)}
.nav-item{flex:1;text-align:center;padding:6px 2px;font-size:.64rem;color:var(--muted)}.nav-item.active{color:#93c5fd}
.nav-item .ico{font-size:16px;display:block;margin-bottom:2px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}.modal{background:#111827;width:100%;max-width:430px;border-radius:18px 18px 0 0;padding:18px 16px 28px;
border-top:1px solid var(--border);max-height:88vh;overflow-y:auto}.modal h3{font-size:1rem;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.modal label{display:block;font-size:.74rem;color:var(--muted);margin-bottom:5px;margin-top:10px}.modal input,.modal select{width:100%;padding:11px 12px;
border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.94rem;outline:none}
.modal-actions{display:flex;gap:8px;margin-top:16px}.btn{flex:1;padding:12px;border-radius:11px;font-weight:650;font-size:.88rem;cursor:pointer;border:none}
.btn-primary{background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff}.btn-ghost{background:var(--card);color:var(--muted);border:1px solid var(--border)}
.btn-danger{background:rgba(244,63,94,.15);color:#fb7185;border:1px solid rgba(244,63,94,.3)}
.empty,.loading{text-align:center;padding:48px 20px;color:var(--muted);font-size:.86rem}.loader{width:24px;height:24px;margin:0 auto 10px;
border:2px solid rgba(255,255,255,.08);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
.fav-empty{text-align:center;padding:42px 20px;color:var(--muted)}.fav-empty .big{font-size:2rem;margin-bottom:8px}
.ai-body{font-size:.82rem;line-height:1.55;color:#dbe4f5;white-space:pre-wrap}.ai-body b{color:#93c5fd}.ai-body i{color:var(--muted)}
.language-menu{position:fixed;top:64px;right:10px;z-index:200;width:190px;background:#111827;border:1px solid rgba(59,130,246,.25);
border-radius:14px;padding:7px;box-shadow:0 15px 40px rgba(0,0,0,.45);backdrop-filter:blur(18px)}
.language-menu button{width:100%;border:0;background:transparent;color:#e8eef7;border-radius:9px;padding:10px;text-align:left;font-size:.82rem}
.language-menu button.active{background:rgba(59,130,246,.20)}
.scan-badge{font-size:.57rem;color:#6ee7b7;margin-left:4px}

<body>

<header class="header">
  <div class="header-top">
    <div class="brand">
      <div class="brand-icon">◈</div>
      <div><h1>Noventra Signal</h1><span>TON · Guardian Gateway · AI Signals <span class="scan-badge">● GUARDIAN</span></span></div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="languageBtn" title="Language">🌐</button>
      <button class="icon-btn" id="refreshBtn" title="Refresh">↻</button>
    </div>
  </div>
  <div class="tabs" id="mainTabs">
    <div class="tab active" data-tab="gainers">Gainers</div>
    <div class="tab" data-tab="losers">Losers</div>
    <div class="tab" data-tab="volume">Volume</div>
    <div class="tab" data-tab="signals">Signals</div>
  </div>
</header>

<div class="alert-banner" id="alertBanner"></div>

<div class="filters" id="filters">
  <div class="chip active" data-tf="h1">1 Hour</div>
  <div class="chip" data-tf="h6">6 Hours</div>
  <div class="chip" data-tf="h24">24 Hours</div>
  <div class="chip active" data-vol="all">All</div>
  <div class="chip" data-vol="high">High Volume</div>
  <div class="chip" data-vol="dedust">DeDust</div>
</div>

<div class="status-bar">
  <span id="statusText">Preparing...</span>
  <span id="countText"></span>
</div>

<section class="page active" id="page-market">
  <div id="content"><div class="loading"><div class="loader"></div><span id="loadingText">Scanning TON market...</span></div></div>
</section>

<section class="page" id="page-favorites">
  <div id="favContent"></div>
</section>

<section class="page" id="page-alerts">
  <div id="alertContent"></div>
</section>

<nav class="bottom-nav">
  <div class="nav-item active" data-page="market"><span class="ico">📊</span><span data-i18n="market">Market</span></div>
  <div class="nav-item" data-page="favorites"><span class="ico">★</span><span data-i18n="favorites">Favorites</span></div>
  <div class="nav-item" data-page="alerts"><span class="ico">🔔</span><span data-i18n="alerts">Alerts</span></div>
</nav>

<div class="modal-bg" id="alertModal">
  <div class="modal">
    <h3><span id="alertTitle">Set Alert</span><span id="modalClose" style="font-size:1.2rem;cursor:pointer;color:var(--muted)">✕</span></h3>
    <div id="modalSymbol" style="font-size:.85rem;color:var(--cyan);margin-bottom:8px"></div>
    <label id="alertTypeLabel">Alert Type</label>
    <select id="alertType">
      <option value="pct_up">When percentage rises (%)</option>
      <option value="pct_down">When percentage falls (%)</option>
      <option value="price_above">When price rises above ($)</option>
      <option value="price_below">When price falls below ($)</option>
    </select>
    <label id="valueLabel">Value</label>
    <input type="number" id="alertValue" placeholder="e.g. 10 or 0.05" step="any" inputmode="decimal">
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modalCancel">Cancel</button>
      <button class="btn btn-primary" id="modalSave">Save</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="aiModal">
  <div class="modal">
    <h3><span id="aiTitle">🤖 AI Analysis</span><span id="aiModalClose" style="font-size:1.2rem;cursor:pointer;color:var(--muted)">✕</span></h3>
    <div class="ai-body" id="aiBody"></div>
    <div class="modal-actions"><button class="btn btn-primary" id="aiModalOk">OK</button></div>
  </div>
</div>

function detectLanguage(){
  try{
    const saved=localStorage.getItem(LANG_KEY);
    if(saved&&LANGUAGES[saved]) return saved;
    const code=(tg?.initDataUnsafe?.user?.language_code||navigator.language||"en").toLowerCase().split("-")[0].split("_")[0];
    return LANGUAGES[code]?code:"en";
  }catch(_){return"en"}
}

async function guardianFetch(path, options={}){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),GUARDIAN_TIMEOUT);
  try{
    const r=await fetch(GUARDIAN_BASE+path,{
      cache:"no-store",
      signal:controller.signal,
      headers:{
        "Accept":"application/json",
        ...(options.headers||{})
      }
    });
    clearTimeout(timer);
    if(!r.ok) throw new Error("Guardian HTTP "+r.status);
    return await r.json();
  }catch(e){
    clearTimeout(timer);
    throw e;
  }
}

function extractGuardianMarkets(payload){
  if(Array.isArray(payload)) return payload;
  if(Array.isArray(payload?.markets)) return payload.markets;
  if(Array.isArray(payload?.pairs)) return payload.pairs;
  if(Array.isArray(payload?.data)) return payload.data;
  if(Array.isArray(payload?.data?.markets)) return payload.data.markets;
  if(Array.isArray(payload?.data?.pairs)) return payload.data.pairs;
  if(Array.isArray(payload?.result)) return payload.result;
  if(Array.isArray(payload?.result?.markets)) return payload.result.markets;
  if(Array.isArray(payload?.result?.pairs)) return payload.result.pairs;
  return [];
}

async function fetchGuardianMarket(){
  setStatus(t("scanning"));
  const payload=await guardianFetch(GUARDIAN_MARKET_ENDPOINT);
  const markets=extractGuardianMarkets(payload);
  if(!markets.length) throw new Error("Guardian market response contains no markets");
  setStatus(t("scanned")+" "+markets.length);
  return markets;
}

/* =========================
   NORMALIZE + SIGNAL ENGINE
========================= */
function normalizePair(p){
  if(!p)return null;

  const chain=String(p.chainId||p.chain||p.network||"ton").toLowerCase();
  if(chain!=="ton")return null;

  const pairAddress=String(p.pairAddress||p.address||p.marketAddress||p.pair?.address||"");
  if(!pairAddress)return null;

  const base=p.baseToken||p.base||p.token||{};
  const quote=p.quoteToken||p.quote||{};
  const changeSource=p.priceChange||p.change||p.changes||{};
  const volumeSource=p.volume||{};
  const liquiditySource=p.liquidity||{};

  const volume=Number(
    volumeSource?.h24 ??
    volumeSource?.["24h"] ??
    volumeSource?.usd24h ??
    p.volume24h ??
    p.vol24h ??
    0
  );

  const liquidity=Number(
    liquiditySource?.usd ??
    liquiditySource?.value ??
    p.liquidityUsd ??
    p.liquidityUSD ??
    p.liquidity24h ??
    0
  );

  if(volume<MIN_VOL||liquidity<MIN_LIQ)return null;

  const dex=String(
    p.dexId||p.dex||p.exchange||p.source||"Unknown"
  ).toLowerCase();

  const name=String(
    base?.name||p.baseName||p.tokenName||base?.symbol||"Unknown Token"
  ).trim().slice(0,32);

  const symbol=String(
    base?.symbol||p.baseSymbol||p.symbol||base?.name||"???"
  ).trim().slice(0,15);

  const address=String(
    base?.address||p.baseAddress||p.tokenAddress||""
  );

  const quoteSymbol=String(
    quote?.symbol||p.quoteSymbol||""
  ).trim().slice(0,12);

  return{
    pairAddress,
    url:p.url||p.dexUrl||p.pairUrl||"",
    dexId:p.dexId||p.dex||p.exchange||p.source||"Unknown",
    isDedust:dex.includes("dedust"),
    isSton:dex.includes("ston"),
    baseName:name,
    baseSymbol:symbol,
    baseAddress:address,
    quoteSymbol,
    priceUsd:Number(p.priceUsd??p.price??p.priceUSD??0),
    change:{
      m5:Number(changeSource?.m5??changeSource?.["5m"]??p.m5??0),
      h1:Number(changeSource?.h1??changeSource?.["1h"]??p.h1??0),
      h6:Number(changeSource?.h6??changeSource?.["6h"]??p.h6??0),
      h24:Number(changeSource?.h24??changeSource?.["24h"]??p.h24??0)
    },
    volume:{h24:volume},
    liquidity,
    txns:Number(
      p.txns?.h24?.buys ??
      p.txns?.h24?.sells ??
      p.txns24h ??
      p.transactions24h ??
      0
    )
  };
}

function calculateSignal(p){
  const c=p.change;
  const momentum=clamp(c.h1*1.8+c.h6*.9+c.h24*.35,-100,100);
  const acceleration=clamp((c.h1-c.m5)*.8,-30,30);
  const volumeFactor=clamp(Math.log10(Math.max(p.volume.h24,1000))/6,.5,1.25);
  let liquidityFactor=clamp(Math.log10(Math.max(p.liquidity,1000))/6,.5,1.2);
  if(p.liquidity<2500)liquidityFactor*=.72;
  let consistency=1;
  if((c.h1>0&&c.h6>0)||(c.h1<0&&c.h6<0))consistency=1.12;
  else if((c.h1>3&&c.h6<-2)||(c.h1<-3&&c.h6>2))consistency=.82;
  let spikeBonus=p.volume.h24>150000?1.15:p.volume.h24>50000?1.08:1;
  let score=clamp((momentum*.70+acceleration*.20)*volumeFactor*liquidityFactor*consistency*spikeBonus,-100,100);
  let signal="neutral";
  if(score>=55&&c.h1>=4&&c.h6>=1.5)signal="strong-buy";
  else if(score>=25&&c.h1>=1.5)signal="buy";
  else if(score<=-55&&c.h1<=-4&&c.h6<=-1.5)signal="strong-sell";
  else if(score<=-25&&c.h1<=-1.5)signal="sell";
  let confidence=48+Math.min(Math.abs(score)*.35,30);
  if(p.volume.h24>25000)confidence+=8;
  if(p.liquidity>8000)confidence+=7;
  if(consistency>1)confidence+=5;
  if(p.liquidity<2500)confidence-=14;
  if(Math.abs(c.h1)>30)confidence-=10;
  confidence=clamp(confidence,12,94);
  const warnings=[];
  if(c.h1>30)warnings.push(t("overheat"));
  if(c.h1<-30)warnings.push(t("oversold"));
  if(p.liquidity<2500)warnings.push(t("lowLiquidity"));
  if(p.volume.h24>100000&&Math.abs(c.h1)>12)warnings.push(t("highVolumeMove"));
  if(Math.abs(c.h1)>8&&p.volume.h24<5000)warnings.push(t("lowVolumeMove"));
  return{score,signal,confidence,warnings}
}

/* =========================
   LOAD
========================= */
async function loadData(){
  if(isLoading)return;
  isLoading=true;
  document.getElementById("refreshBtn").classList.add("spin");
  setStatus(t("scanning"));
  try{
    const raw=await fetchGuardianMarket(), seen=new Set(), collected=[];
    for(const rp of raw){
      const p=normalizePair(rp);if(!p||seen.has(p.pairAddress))continue;
      seen.add(p.pairAddress);
      Object.assign(p,calculateSignal(p));
      collected.push(p);
    }
    collected.sort((a,b)=>Math.abs(b.score)-Math.abs(a.score));
    pairs=collected;
    document.getElementById("countText").textContent=pairs.length+" "+t("pairs");
    setStatus(t("updated")+": "+new Date().toLocaleTimeString(locale()));
    checkAlerts();render();renderFavorites();renderAlertsPage();
  }catch(e){console.error(e);setStatus(t("dataError"))}
  finally{isLoading=false;document.getElementById("refreshBtn").classList.remove("spin")}
}

/* =========================
   FILTER / CARD
========================= */
function getFiltered(){
  let list=[...pairs];
  if(volFilter==="high")list=list.filter(p=>p.volume.h24>=HIGH_VOL);
  if(volFilter==="dedust")list=list.filter(p=>p.isDedust);
  if(currentTab==="gainers"){list=list.filter(p=>p.change[currentTf]>1).sort((a,b)=>b.change[currentTf]-a.change[currentTf])}
  else if(currentTab==="losers"){list=list.filter(p=>p.change[currentTf]<-1).sort((a,b)=>a.change[currentTf]-b.change[currentTf])}
  else if(currentTab==="volume")list.sort((a,b)=>b.volume.h24-a.volume.h24);
  else{
    const order={"strong-buy":0,buy:1,"strong-sell":2,sell:3,neutral:9};
    list=list.filter(p=>p.signal!=="neutral").sort((a,b)=>(order[a.signal]-order[b.signal])||(Math.abs(b.score)-Math.abs(a.score)));
  }
  return list.slice(0,MAX_RESULTS);
}

function isFav(a){return favorites.some(x=>x.pairAddress===a)}
function hasAlert(a){return alerts.some(x=>x.pairAddress===a)}

function cardHTML(p,i){
  const ch=p.change[currentTf], fav=isFav(p.pairAddress), alarm=hasAlert(p.pairAddress);
  const dexClass=p.isDedust?"dedust":p.isSton?"ston":"other", dexLabel=p.isDedust?"DeDust":p.isSton?"Ston.fi":String(p.dexId||"DEX").slice(0,8);
  const sig=signalLabel(p.signal), addr=escJS(p.pairAddress), score=Number(p.score||0);
  const confidence=p.confidence!=null?" · %"+p.confidence.toFixed(0):"";
  const sw=Math.min(Math.abs(score),100), color=score>=0?"var(--green)":"var(--red)";
  return `<div class="card ${fav?"fav":""} ${alarm?"alert-hit":""}">
    <div class="card-top">
      <div class="rank ${i<3?"top":""}">${i+1}</div>
      <div class="info">
        <div class="sym-row">
          <div class="token-title"><span class="token-name">${esc(p.baseName)}</span><span class="token-symbol">${esc(p.baseSymbol)}</span></div>
          <span class="dex ${dexClass}">${esc(dexLabel)}</span>
          ${sig?`<span class="signal ${p.signal}">${sig}</span>`:""}
        </div>
        <div class="meta">${fmtMoney(p.liquidity)} ${t("liquidity")} · ${fmtMoney(p.volume.h24)} ${t("vol")}${p.quoteSymbol?" · "+esc(p.quoteSymbol):""}</div>
      </div>
      <div class="right">
        <div class="chg ${ch>=0?"up":"down"}">${fmtPct(ch)}</div>
        <div class="actions">
          <button class="act-btn ${fav?"on":""}" onclick="toggleFavByAddr('${addr}')">★</button>
          <button class="act-btn ${alarm?"alert-on":""}" onclick="openAlertByAddr('${addr}')">🔔</button>
          <button class="act-btn" onclick="openAIAnalysis('${addr}')">🤖</button>
          <button class="act-btn" onclick="openPair('${escJS(p.url)}')">↗</button>
        </div>
      </div>
    </div>
    <div class="tf-row">
      ${["m5","h1","h6","h24"].map((x,j)=>`<div class="tf"><div class="lbl">${["5m","1h","6h","24h"][j]}</div><div class="v ${cls(p.change[x])}">${fmtPct(p.change[x])}</div></div>`).join("")}
    </div>
    <div class="score-row"><span>${t("score")}</span><span class="score-value">${score>0?"+":""}${score.toFixed(0)}${confidence}</span></div>
    <div class="bar"><div style="width:${sw}%;background:${color}"></div></div>
  </div>`;
}

function render(){
  if(currentPage!=="market")return;
  const list=getFiltered(), el=document.getElementById("content");
  if(!list.length){el.innerHTML=`<div class="empty">${t("noResults")}<br><small>${t("refreshOrFilter")}</small></div>`;return}
  el.innerHTML='<div class="list">'+list.map(cardHTML).join("")+"</div>";
}

function renderFavorites(){
  const el=document.getElementById("favContent");
  if(!favorites.length){el.innerHTML=`<div class="fav-empty"><div class="big">★</div>${t("noFavorites")}<br>${t("addFavorite")}</div>`;return}
  const items=favorites.map(f=>pairs.find(p=>p.pairAddress===f.pairAddress)||{
    pairAddress:f.pairAddress,baseSymbol:f.symbol,baseName:f.name||f.symbol,baseAddress:f.baseAddress||"",dexId:f.dexId,url:f.url,
    priceUsd:0,change:{m5:0,h1:0,h6:0,h24:0},volume:{h24:0},liquidity:0,score:0,signal:"neutral",confidence:0,warnings:[]
  });
  el.innerHTML='<div class="list">'+items.map(cardHTML).join("")+"</div>";
}

function renderAlertsPage(){
  const el=document.getElementById("alertContent");
  if(!alerts.length){el.innerHTML=`<div class="fav-empty"><div class="big">🔔</div>${t("noAlerts")}<br>${t("setAlertShort")}</div>`;return}
  const labels={pct_up:t("percentUp"),pct_down:t("percentDown"),price_above:"≥ $",price_below:"≤ $"};
  el.innerHTML='<div class="list">'+alerts.map(a=>{
    const live=pairs.find(p=>p.pairAddress===a.pairAddress), price=live?formatPrice(live.priceUsd):"—";
    const suffix=a.type.startsWith("pct")?"%":"$";
    return `<div class="card"><div class="card-top"><div class="info"><div class="sym-row"><div class="token-title"><span class="token-name">${esc(a.name||a.symbol||t("unknownToken"))}</span><span class="token-symbol">${esc(a.symbol||"???")}</span></div></div><div class="meta">${labels[a.type]||a.type} ${a.value}${suffix} · ${t("now")}: $${price}</div></div><button class="btn btn-danger" style="flex:none;padding:8px 12px;font-size:.72rem" onclick="removeAlert('${escJS(a.id)}')">${t("delete")}</button></div></div>`;
  }).join("")+"</div>";
}

/* =========================

========================= */
function toggleFav(p){
  if(isFav(p.pairAddress))favorites=favorites.filter(x=>x.pairAddress!==p.pairAddress);
  else favorites.push({pairAddress:p.pairAddress,symbol:p.baseSymbol,name:p.baseName,baseAddress:p.baseAddress||"",dexId:p.dexId,url:p.url});
  saveJSON(FAV_KEY,favorites);render();renderFavorites();
}
window.toggleFavByAddr=a=>{const p=pairs.find(x=>x.pairAddress===a),f=favorites.find(x=>x.pairAddress===a);if(p)toggleFav(p);else if(f)toggleFav({...f,baseSymbol:f.symbol,baseName:f.name||f.symbol})};

function openAlertModal(p){
  alertTarget=p;
  document.getElementById("modalSymbol").textContent=`${p.baseName} (${p.baseSymbol}) · $${formatPrice(p.priceUsd)}`;
  document.getElementById("alertValue").value="";
  document.getElementById("alertType").value="pct_up";
  document.getElementById("alertModal").classList.add("show");
}
window.openAlertByAddr=a=>{const p=pairs.find(x=>x.pairAddress===a);if(p)openAlertModal(p);else showAlert(t("tokenNotListed"))};
function closeModal(){document.getElementById("alertModal").classList.remove("show");alertTarget=null}
function saveAlert(){
  if(!alertTarget)return;
  const type=document.getElementById("alertType").value,value=parseFloat(document.getElementById("alertValue").value);
  if(!Number.isFinite(value)||value<=0){showAlert(t("invalidValue"));return}
  alerts=alerts.filter(a=>!(a.pairAddress===alertTarget.pairAddress&&a.type===type));
  alerts.push({id:Date.now().toString(36),pairAddress:alertTarget.pairAddress,symbol:alertTarget.baseSymbol,name:alertTarget.baseName,type,value,url:alertTarget.url,created:Date.now()});
  saveJSON(ALERT_KEY,alerts);const sym=alertTarget.baseSymbol;closeModal();render();renderAlertsPage();showPopup(t("saved"),`${sym} ${t("alertCreated")}`);
}
function removeAlert(id){alerts=alerts.filter(a=>a.id!==id);saveJSON(ALERT_KEY,alerts);renderAlertsPage();render();checkAlerts()}
window.removeAlert=removeAlert;

function checkAlerts(){
  const hits=[];
  for(const a of alerts){
    const p=pairs.find(x=>x.pairAddress===a.pairAddress);if(!p)continue;
    const hit=(a.type==="pct_up"&&p.change.h1>=a.value)||(a.type==="pct_down"&&p.change.h1<=-a.value)||(a.type==="price_above"&&p.priceUsd>=a.value)||(a.type==="price_below"&&p.priceUsd<=a.value);
    if(hit)hits.push(a);
  }
  const b=document.getElementById("alertBanner");
  if(!hits.length){b.classList.remove("show");return}
  b.innerHTML=hits.map(a=>"🔔 <b>"+esc(a.symbol)+"</b> "+t("triggered")).join("<br>");
  b.classList.add("show");
  try{tg?.HapticFeedback?.notificationOccurred("warning")}catch(_){}
}

/* =========================
   LOCALIZED AI ANALYSIS
========================= */
function generateAIAnalysis(p){
  const c=p.change,score=p.score||0,conf=p.confidence||50,v=p.volume.h24,l=p.liquidity;
  let trend=score>=70?t("veryStrongUp"):score>=55?t("strongUp"):score>=35?t("positive"):score>=15?t("slightlyPositive"):score>-15?t("neutralTrend"):score>-35?t("slightlyNegative"):score>-55?t("weak"):score>-70?t("strongDown"):t("veryStrongDown");
  let volume=v>=200000?`${t("volumeVeryHigh")} (${fmtMoney(v)})`:v>=50000?`${t("volumeHigh")} (${fmtMoney(v)})`:v>=15000?`${t("volumeMedium")} (${fmtMoney(v)})`:v>=5000?`${t("volumeLowMedium")} (${fmtMoney(v)})`:`${t("volumeVeryLow")} (${fmtMoney(v)})`;
  let liq=l>=100000?`${t("liquidityStrong")} (${fmtMoney(l)})`:l>=20000?`${t("liquidityEnough")} (${fmtMoney(l)})`:l>=5000?`${t("liquidityMedium")} (${fmtMoney(l)})`:l>=1500?`${t("liquidityWeak")} (${fmtMoney(l)})`:`${t("liquidityCritical")} (${fmtMoney(l)})`;
  const ups=[c.m5,c.h1,c.h6,c.h24].filter(x=>x>1).length,downs=[c.m5,c.h1,c.h6,c.h24].filter(x=>x<-1).length;
  const tf=ups>=3?t("multiUp"):downs>=3?t("multiDown"):c.h1>5&&c.h6<-3?t("shortUpMediumWeak"):c.h1<-5&&c.h6>3?t("shortDownMediumPositive"):t("mixed");
  const risks=[];
  if(c.h1>25)risks.push(`${fmtPct(c.h1)} 1h — ${t("overheat")}.`);
  if(c.h1<-25)risks.push(`${fmtPct(c.h1)} 1h — ${t("oversold")}.`);
  if(l<2500)risks.push(t("lowLiquidity"));
  if(v<5000&&Math.abs(c.h1)>8)risks.push(t("lowVolumeMove"));
  if(c.h1>0&&c.h6<-8)risks.push(t("shortUpMediumWeak"));
  if(c.h1<0&&c.h6>10)risks.push(t("shortDownMediumPositive"));
  if(!risks.length)risks.push(t("noExtraWarnings"));
  let advice=p.signal==="strong-buy"&&conf>=65?t("adviceStrongBuy"):p.signal==="buy"&&conf>=60?t("adviceBuy"):p.signal==="buy"?t("adviceWeakBuy"):p.signal==="strong-sell"?t("adviceStrongSell"):p.signal==="sell"?t("adviceSell"):Math.abs(score)<15?t("adviceNeutral"):t("adviceWatch");
  const s=score>0?"+"+score.toFixed(0):score.toFixed(0);
  return `<b>${esc(p.baseName)} (${esc(p.baseSymbol)}) — ${t("aiAnalysis")}</b>

<b>${t("general")}:</b> ${trend}
<b>${t("technical")}:</b>
• 5m: ${fmtPct(c.m5)}
• 1h: ${fmtPct(c.h1)}
• 6h: ${fmtPct(c.h6)}
• 24h: ${fmtPct(c.h24)}

<b>${t("score")}:</b> ${s} (${signalLabel(p.signal)||t("neutral")})
<b>${t("confidence")}:</b> %${conf.toFixed(0)}
<b>${t("timeframe")}:</b> ${tf}
<b>${t("volume")}:</b> ${volume}
<b>${t("liquidity")}:</b> ${liq}

<b>${t("warnings")}:</b> ${esc((p.warnings||[]).join(" · ")||"—")}
<b>${t("risks")}:</b>
• ${risks.map(esc).join("\n• ")}

<b>${t("summary")}:</b> ${esc(advice)}

<i>${t("disclaimer")}</i>`;
}
function openAIAnalysis(a){const p=pairs.find(x=>x.pairAddress===a);if(!p){showAlert(t("tokenDataMissing"));return}document.getElementById("aiBody").innerHTML=generateAIAnalysis(p);document.getElementById("aiModal").classList.add("show")}

function setLanguage(lang){
  if(!LANGUAGES[lang])return;
  currentLanguage=lang;try{localStorage.setItem(LANG_KEY,lang)}catch(_){}
  document.documentElement.lang=lang;applyLanguage();render();renderFavorites();renderAlertsPage();
}
function applyLanguage(){
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  const tabs={gainers:t("gainers"),losers:t("losers"),volume:t("volume"),signals:t("signals")};
  document.querySelectorAll("#mainTabs .tab").forEach(el=>el.textContent=tabs[el.dataset.tab]);
  document.querySelectorAll(".chip").forEach(el=>{
    if(el.dataset.tf==="h1")el.textContent=t("hour1");
    if(el.dataset.tf==="h6")el.textContent=t("hour6");
    if(el.dataset.tf==="h24")el.textContent=t("hour24");
    if(el.dataset.vol==="all")el.textContent=t("all");
    if(el.dataset.vol==="high")el.textContent=t("highVolume");
    if(el.dataset.vol==="dedust")el.textContent=t("dedust");
  });
  document.getElementById("loadingText").textContent=t("scanning");
  document.getElementById("alertTitle").textContent=t("alertSet");
  document.getElementById("alertTypeLabel").textContent=t("alertType");
  document.getElementById("valueLabel").textContent=t("value");
  document.getElementById("modalCancel").textContent=t("cancel");
  document.getElementById("modalSave").textContent=t("save");
  document.getElementById("aiTitle").textContent="🤖 "+t("aiAnalysis");
  document.getElementById("aiModalOk").textContent=t("ok");
  document.getElementById("alertValue").placeholder=t("example");
  document.getElementById("alertType").innerHTML=`<option value="pct_up">${t("percentUp")}</option><option value="pct_down">${t("percentDown")}</option><option value="price_above">${t("priceAbove")}</option><option value="price_below">${t("priceBelow")}</option>`;
  document.getElementById("refreshBtn").title=currentLanguage==="tr"?"Yenile":currentLanguage==="ru"?"Обновить":currentLanguage==="zh"?"刷新":currentLanguage==="ja"?"更新":currentLanguage==="ko"?"새로고침":"Refresh";
}

  render();
}));
document.querySelectorAll(".nav-item").forEach(item=>item.addEventListener("click",()=>{
  document.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("active"));item.classList.add("active");currentPage=item.dataset.page;
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById("page-"+currentPage).classList.add("active");
  const market=currentPage==="market";document.getElementById("filters").style.display=market?"flex":"none";document.getElementById("mainTabs").style.display=market?"flex":"none";
  if(currentPage==="favorites")renderFavorites();if(currentPage==="alerts")renderAlertsPage();if(market)render();
}));
document.getElementById("refreshBtn").onclick=loadData;
document.getElementById("modalClose").onclick=closeModal;
document.getElementById("modalCancel").onclick=closeModal;
document.getElementById("modalSave").onclick=saveAlert;
document.getElementById("alertModal").onclick=e=>{if(e.target.id==="alertModal")closeModal()};
document.getElementById("aiModalClose").onclick=closeAIModal;
document.getElementById("aiModalOk").onclick=closeAIModal;
document.getElementById("aiModal").onclick=e=>{if(e.target.id==="aiModal")closeAIModal()};

/* =========================
   START
========================= */
document.documentElement.lang=currentLanguage;
applyLanguage();
loadData();
setInterval(()=>{if(!isLoading)loadData()},REFRESH_MS);
</script>
</body>
</html>
