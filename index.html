<style>
:root{
  --bg:#070b14;
  --card:#101827;
  --card2:#151f30;
  --text:#e8eef7;
  --muted:#73819a;
  --blue:#3b82f6;
  --cyan:#22d3ee;
  --green:#10b981;
  --red:#f43f5e;
  --orange:#f59e0b;
  --border:rgba(59,130,246,.14)
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

body{
  margin:0;
  background:
    radial-gradient(circle at 50% -20%,rgba(37,99,235,.18),transparent 42%),
    var(--bg);
  color:var(--text);
  font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:76px
}

button,input,select{font:inherit}
button{cursor:pointer}

.header{
  position:sticky;
  top:0;
  z-index:30;
  padding:13px;
  background:rgba(7,11,20,.96);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border)
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.brand{
  display:flex;
  gap:10px;
  align-items:center
}

.logo{
  width:40px;
  height:40px;
  border-radius:12px;
  background:linear-gradient(135deg,#1d4ed8,#7c3aed);
  display:grid;
  place-items:center;
  font-size:20px
}

.brand b{
  display:block;
  font-size:16px
}

.brand small{
  color:var(--muted);
  font-size:10px
}

.actions{
  display:flex;
  gap:6px
}

.icon{
  width:36px;
  height:36px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text)
}

.icon.spin{
  animation:spin .7s linear infinite
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.tabs{
  display:flex;
  gap:4px;
  margin-top:11px;
  background:var(--card);
  padding:3px;
  border-radius:12px
}

.tab{
  flex:1;
  text-align:center;
  padding:8px 2px;
  border-radius:9px;
  color:var(--muted);
  font-size:11px;
  font-weight:700
}

.tab.on{
  background:linear-gradient(135deg,#1d4ed8,#3b82f6);
  color:#fff
}

.filters{
  display:flex;
  gap:6px;
  overflow:auto;
  padding:10px 12px 4px;
  scrollbar-width:none
}

.filters::-webkit-scrollbar{display:none}

.chip{
  white-space:nowrap;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--muted);
  border-radius:20px;
  padding:6px 10px;
  font-size:11px
}

.chip.on{
  color:#bfdbfe;
  border-color:#3b82f6;
  background:rgba(59,130,246,.16)
}

.status{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:10px;
  padding:5px 13px
}

.list{
  padding:5px 12px 18px;
  display:grid;
  gap:8px
}

.card{
  background:linear-gradient(145deg,#101827,#0d1522);
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px
}

.card.favorite{
  border-color:rgba(129,140,248,.45)
}

.card.alert-hit{
  border-color:var(--orange);
  box-shadow:0 0 15px rgba(245,158,11,.16)
}

.row{
  display:flex;
  align-items:center;
  gap:9px
}

.rank{
  width:24px;
  height:24px;
  border-radius:7px;
  background:#182235;
  color:var(--muted);
  display:grid;
  place-items:center;
  font-size:10px;
  font-weight:800;
  flex-shrink:0
}

.info{
  flex:1;
  min-width:0
}

.name{
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.sym{
  font-size:10px;
  color:var(--muted);
  margin-left:5px
}

.meta{
  color:var(--muted);
  font-size:9px;
  margin-top:3px
}

.right{
  text-align:right;
  min-width:82px
}

.chg{
  font-size:15px;
  font-weight:800
}

.up{color:var(--green)}
.down{color:var(--red)}
.neutral{color:var(--muted)}

.badges{
  display:flex;
  gap:4px;
  margin-top:5px;
  justify-content:flex-end

.badge{
  font-size:8px;
  padding:3px 5px;
  border-radius:5px;
  background:rgba(255,255,255,.06);
  color:var(--muted)
}

.buy{
  background:rgba(16,185,129,.15);
  color:#34d399
}

.sell{
  background:rgba(244,63,94,.15);
  color:#fb7185
}

.watch{
  background:rgba(245,158,11,.12);
  color:#fbbf24
}

.buttons{
  display:flex;
  gap:4px;
  margin-top:8px
}

.btn{
  flex:1;
  border:1px solid var(--border);
  background:var(--card2);
  color:var(--muted);
  border-radius:8px;
  padding:7px 4px;
  font-size:10px
}

.btn.ai{
  color:#93c5fd;
  border-color:rgba(59,130,246,.3)
}

.btn.favorite-on{
  color:#a5b4fc;
  border-color:#6366f1
}

.btn.alert-on{
  color:#fbbf24;
  border-color:#f59e0b
}

.tf{
  display:flex;
  gap:4px;
  margin-top:9px
}

.tf div{
  flex:1;
  background:rgba(255,255,255,.025);
  border-radius:7px;
  padding:5px 2px;
  text-align:center;
  font-size:9px
}

.tf small{
  display:block;
  color:var(--muted);
  font-size:8px
}

.score{
  margin-top:7px;
  color:var(--muted);
  font-size:9px;
  display:flex;
  justify-content:space-between
}

.score b{

}

.bar{
  height:3px;
  background:rgba(255,255,255,.05);
  border-radius:2px;
  margin-top:3px;
  overflow:hidden

.bar i{
  display:block;
  height:100%;
  background:var(--blue)

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:30;
  background:rgba(12,18,32,.97);
  border-top:1px solid var(--border);
  display:flex;
  padding:6px 8px

.nav{

  text-align:center;
  color:var(--muted);

.nav.on{

.empty,.loading{

.spin{

  height:24px;

  border-top-color:var(--blue);
  border-radius:50%;

.modalbg{

  background:rgba(0,0,0,.75);
  z-index:100;

  align-items:flex-end

.modalbg.show{

.modal{

  overflow:auto;

/*
 TON-SPECIFIC LIQUIDITY MODEL

 We intentionally do NOT use EVM-style
 liquidity thresholds.

 TON early-stage pairs can legitimately
 have much lower liquidity.
*/

  VERY_THIN: 1000,

const $ =

function num(v){

  const n =
    Number(v);

  return Number.isFinite(n)
    ? n
    : 0;

}


function esc(v){

  return String(
    v ?? ""
  ).replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "\"":"&quot;",
      "'":"&#039;"
    }[m])
  );

}


function money(v){

  v =
    num(v);

  if(v >= 1e9)
    return "$"+(v/1e9).toFixed(1)+"B";

  if(v >= 1e6)
    return "$"+(v/1e6).toFixed(1)+"M";

  if(v >= 1e3)
    return "$"+(v/1e3).toFixed(1)+"K";

  if(v > 0)
    return "$"+v.toFixed(0);

  return "$0";

}


function pct(v){

  v =
    num(v);

  return (
    v > 0
      ? "+"
      : ""
  ) + v.toFixed(1) + "%";

}


function price(v){

  v =
    num(v);

  if(!v)
    return "0";

  if(v < 0.000001)
    return v.toExponential(2);

  if(v < 0.01)
    return v.toFixed(6);

  if(v < 1)
    return v.toFixed(5);

  if(v < 100)
    return v.toFixed(3);

  return v.toFixed(2);

}


function cls(v){

  v =
    num(v);

  if(v > 0.25)
    return "up";

  if(v < -0.25)
    return "down";

  return "neutral";

}


function setStatus(text){

      ? value

  }catch{

    return fallback;

}


function saveJSON(

  value
){

  try{

/* =========================================================
   API
========================================================= */

async function get(
  path,
  options={}
){

  const response =
    await fetch(
      API + path,
      {
        cache:"no-store",
        ...options,

        headers:{
          Accept:"application/json",
          ...(options.headers||{})
        }
      }
    );


  const data =
    await response
      .json()
      .catch(
        () => ({
          ok:false,
          error:"Invalid JSON"
        })
      );


  if(
    !response.ok ||
    data.ok === false
  ){

    throw new Error(
      data.error ||
      data.message ||
      "Request failed"
    );

  }


  return data;

}


/* =========================================================

function normalize(p){

  return {

    ...p,

    baseToken:
      p.baseToken || {},

    change:
      p.change || {},

    volume:
      p.volume || {
        h24:0
      },

    liquidity:
      num(p.liquidity),

    score:
      num(p.score),

    confidence:
      num(p.confidence)

  };

}


/* =========================================================
   TON LIQUIDITY INTELLIGENCE
========================================================= */

function tonLiquidity(
  liquidity
){

  liquidity =
    num(liquidity);


  if(
    liquidity <
    TON_LIQUIDITY.VERY_THIN
  ){

    return {
      level:"very-thin",
      label:t("veryThin"),
      className:"bad",
      description:
        "Very shallow TON pool."
    };

  }


  if(
    liquidity <
    TON_LIQUIDITY.THIN
  ){

    return {
      level:"thin",
      label:t("thin"),
      className:"warn",
      description:
        "Thin TON liquidity; price impact can be significant."
    };

  }


  if(
    liquidity <
    TON_LIQUIDITY.EARLY
  ){

    return {
      level:"early",
      label:t("early"),
      className:"warn",
      description:
        "Acceptable for an early-stage TON market."
    };

  }


  if(
    liquidity <
    TON_LIQUIDITY.GOOD
  ){

    return {
      level:"good",
      label:t("good"),
      className:"good",
      description:
        "Good liquidity for a TON market."
    };

  }


  return {
    level:"strong",
    label:t("strong"),
    className:"good",
    description:
      "Strong liquidity for TON."
  };

}


function volumeLiquidityRatio(
  volume,
  liquidity
){

  volume =
    num(volume);

  liquidity =
    num(liquidity);

  if(
    liquidity <= 0
  )
    return 0;

  return volume / liquidity;

}

function isFavorite(
  address
){

  return favorites.some(
    x =>
      x.pairAddress ===
      address
  );

}


function toggleFavorite(
  pair
){

  if(
    isFavorite(
      pair.pairAddress
    )
  ){

    favorites =
      favorites.filter(
        x =>
          x.pairAddress !==
          pair.pairAddress
      );

  }else{

    favorites.push({

      pairAddress:
        pair.pairAddress,

      symbol:
        pair.baseToken?.symbol ||
        "???",

      name:
        pair.baseToken?.name ||
        "Unknown Token",

      url:
        pair.url || "",

      baseAddress:
        pair.baseToken?.address ||
        ""

    });

  }


  saveJSON(
    FAV_KEY,
    favorites
  );

  render();

}


/* =========================================================
   ALERTS
========================================================= */

function hasAlert(
  address
){

  return alerts.some(
    x =>
      x.pairAddress ===
      address
  );

}


function openAlert(
  index
){

  const pair =
    pairs[index];

  if(!pair)
    return;

  currentAlertPair =
    pair;

  $("alertToken").textContent =
    `${pair.baseToken?.name || "Unknown"} (${pair.baseToken?.symbol || "???"}) · $${price(pair.priceUsd)}`;

  $("alertValue").value =
    "";

  $("alertModal")
    .classList
    .add("show");

}


function closeAlert(){

  $("alertModal")
    .classList
    .remove("show");

  currentAlertPair =
    null;

}


function saveAlert(){

  if(!currentAlertPair)
    return;


  const type =
    $("alertType").value;

  const value =
    parseFloat(
      $("alertValue").value
    );


  if(
    !Number.isFinite(value) ||
    value <= 0
  ){

    alert(
      "Enter a valid value."
    );

    return;

  }


  alerts =
    alerts.filter(
      x =>
        !(
          x.pairAddress ===
          currentAlertPair.pairAddress &&
          x.type === type
        )
    );


  alerts.push({

    id:
      Date.now().toString(36),

    pairAddress:
      currentAlertPair.pairAddress,

    symbol:
      currentAlertPair.baseToken?.symbol ||
      "???",

    name:
      currentAlertPair.baseToken?.name ||
      "Unknown Token",

    type,

    value,

    created:
      Date.now()

  });


  saveJSON(
    ALERT_KEY,
    alerts
  );

  closeAlert();

  render();

}


function removeAlert(
  id
){

  alerts =
    alerts.filter(
      x =>
        x.id !== id
    );

  saveJSON(
    ALERT_KEY,
    alerts
  );

  renderAlerts();

  render();

}


function checkAlerts(){

  const triggered =
    [];

  for(
    const alertItem
    of alerts
  ){

    const pair =
      pairs.find(
        p =>
          p.pairAddress ===
          alertItem.pairAddress
      );

    if(!pair)
      continue;


    const h1 =
      num(pair.change?.h1);

    const currentPrice =
      num(pair.priceUsd);


    let hit =
      false;


    if(
      alertItem.type ===
      "pct_up"
    ){

      hit =
        h1 >=
        alertItem.value;

    }


    if(
      alertItem.type ===
      "pct_down"
    ){

      hit =
        h1 <=
        -alertItem.value;

    }


    if(
      alertItem.type ===
      "price_above"
    ){

      hit =
        currentPrice >=
        alertItem.value;

    }


    if(
      alertItem.type ===
      "price_below"
    ){

      hit =
        currentPrice <=
        alertItem.value;

    }


    if(hit)
      triggered.push(
        alertItem
      );

  }


  if(
    triggered.length
  ){

    try{
      tg?.HapticFeedback
        ?.notificationOccurred(
          "warning"
        );
    }catch{}

  }

}


/* =========================================================
   FILTER
========================================================= */

function filtered(){

  let result =
    [...pairs];


  if(
    volumeFilter ===
    "high"
  ){

    result =
      result.filter(
        p =>
          num(p.volume?.h24) >=
          20000
      );

  }


  if(
    volumeFilter ===
    "dedust"
  ){

    result =
      result.filter(
        p =>
          p.isDedust === true ||
          String(
            p.dexId || ""
          )
          .toLowerCase()
          .includes(
            "dedust"
          )
      );

  }


  if(
    tab ===
    "gainers"
  ){

    result =
      result
        .filter(
          p =>
            num(
              p.change?.[tf]
            ) > 1
        )
        .sort(
          (a,b) =>
            num(b.change?.[tf]) -
            num(a.change?.[tf])
        );

  }


  else if(
    tab ===
    "losers"
  ){

    result =
      result
        .filter(
          p =>
            num(
              p.change?.[tf]
            ) < -1
        )
        .sort(
          (a,b) =>
            num(a.change?.[tf]) -
            num(b.change?.[tf])
        );

  }


  else if(
    tab ===
    "volume"
  ){

    result =
      result.sort(
        (a,b) =>
          num(b.volume?.h24) -
          num(a.volume?.h24)
      );

  }


  else{

    result =
      result
        .filter(
          p =>
            p.signal &&
            p.signal !==
            "neutral"
        )
        .sort(
          (a,b) =>
            Math.abs(
              num(b.score)
            ) -
            Math.abs(
              num(a.score)
            )
        );

  }


  return result.slice(
    0,
    150
  );

}


/* =========================================================
   SIGNAL TEXT
========================================================= */

function signalText(
  signal
){

  if(
    signal ===
    "strong-buy"
  )
    return t("strongbuy");

  if(
    signal ===
    "buy"
  )
    return t("buy");

  if(
    signal ===
    "strong-sell"
  )
    return t("strongsell");

  if(
    signal ===
    "sell"
  )
    return t("sell");

  return t("watch");

}

        volumeLiquidityRatio:
          ratio,

        tonLiquidityLevel:
          liquidity.level,

        tonLiquidityLabel:
          liquidity.label,

        tonLiquidityDescription:
          liquidity.description,

        score:
          pair.score,

        signal:
          pair.signal,

        confidence:
          pair.confidence

      },

      guardian

    };


    const response =
      await get(
        "/api/ai",
        {

          method:
            "POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              body
            )

        }
      );


    showAI(
      response.analysis,
      pair,
      liquidity,
      ratio
    );


  }catch(error){

    console.error(
      "Guardian AI:",
      error
    );


    $("ai").innerHTML =
      `<div class="ai-error">

        <b>
          ${t("error")}
        </b>

        <br><br>

        ${esc(
          error.message
        )}

      </div>`;

  }

}


/* =========================================================
   AI RESULT
========================================================= */

function showAI(
  analysis,
  pair,
  liquidity,
  ratio
){

  const a =
    analysis || {};


  const array =
    value =>
      Array.isArray(value)
        ? value
        : [];


  let signalClass =
    "watch";


  if(
    String(
      a.signal || ""
    )
      .toUpperCase()
      .includes("BUY")
  )
    signalClass =
      "good";


  if(
    String(
      a.signal || ""
    )
      .toUpperCase()
      .includes("SELL")
  )
    signalClass =
      "bad";


  $("ai").innerHTML = `

    <div>

      <span class="pill ${signalClass}">
        ${esc(
          a.signal ||
          "WATCH"
        )}
      </span>

      <span class="pill">
        ${t("confidence")}:
        ${num(a.confidence)}%
      </span>

      <span class="pill">
        ${esc(
          a.action ||
          "WATCH"
        )}
      </span>

    </div>


    <h4>
      ${esc(
        a.headline ||
        pair.baseToken?.name ||
        "Token"
      )}
    </h4>


    <p>
      ${esc(
        a.marketState ||
        ""
      )}
    </p>


    <h4>
      ${t("reason")}
    </h4>

    <ul>

      ${
        array(
          a.reasoning
        )
        .map(
          x =>
            `<li>${esc(x)}</li>`
        )
        .join("")
      }

    </ul>


    <h4>
      ${t("tonContext")}
    </h4>

    <p>

      ${esc(
        liquidity.description
      )}

      <br><br>

      <span class="pill">
        ${esc(
          liquidity.label
        )}
      </span>

      <span class="pill">
        ${t("volumeRatio")}:
        ${
          ratio
            ? ratio.toFixed(1)+"x"
            : "—"
        }
      </span>

    </p>


    <h4>
      ${t("short")} / ${t("medium")} / ${t("long")}
    </h4>

    <p>
      <b>${t("short")}:</b>
      ${esc(
        a.timeframes?.short ||
        "—"
      )}
    </p>

    <p>
      <b>${t("medium")}:</b>
      ${esc(
        a.timeframes?.medium ||
        "—"
      )}
    </p>

    <p>
      <b>${t("long")}:</b>
      ${esc(
        a.timeframes?.long ||
        "—"
      )}
    </p>


    <h4>
      ${t("liquidity")}
    </h4>

    <p>
      ${esc(
        a.liquidityView ||
        "—"
      )}
    </p>


    <h4>
      ${t("volume24")}
    </h4>

    <p>
      ${esc(
        a.volumeView ||
        "—"
      )}
    </p>


    <h4>
      ${t("risks")}
    </h4>

    ${
      array(
        a.riskFlags
      ).length
      ?

      `<ul>
        ${
          array(
            a.riskFlags
          )
          .map(
            x =>
              `<li class="danger">
                ${esc(x)}
              </li>`
          )
          .join("")
        }
      </ul>`

      :

      "<p>—</p>"
    }


    <h4>
      ${t("bull")}
    </h4>

    <p>
      ${esc(
        a.bullCase ||
        "—"
      )}
    </p>


    <h4>
      ${t("bear")}
    </h4>

    <p>
      ${esc(
        a.bearCase ||
        "—"
      )}
    </p>


    <h4>
      ${t("summary")}
    </h4>

    <p>
      ${esc(
        a.summary ||
        "—"
      )}
    </p>


    <p
      style="
        margin-top:18px;
        color:var(--muted);
        font-size:10px
      "
    >
      Noventra Guardian AI analyzes
      observable market and security data.
      It is not financial advice.
    </p>

  `;

}


/* =========================================================
   DEX
========================================================= */

function openPair(
  url
){

  if(!url)
    return;


  try{

    if(
      tg?.openLink
    ){

      tg.openLink(
        url
      );

    }else{

      window.open(
        url,
        "_blank",
        "noopener,noreferrer"
      );

    }

  }catch{

    window.open(
      url,
      "_blank"
    );

  }

}


/* =========================================================
   MARKET LOAD
========================================================= */

async function load(){

  if(loading)
    return;


  loading =
    true;


  $("refresh")
    .classList
    .add("spin");


  setStatus(
    t("scan")
  );


  try{

    const data =
      await get(
        "/api/market"
      );


    pairs =
      (
        data.pairs ||
        []
      )
      .map(
        normalize
      );


    $("count").textContent =
      pairs.length +
      " " +
      t("pairs");


    setStatus(
      t("updated") +
      ": " +
      new Date()
        .toLocaleTimeString()
    );


    checkAlerts();


    render();


  }catch(error){

    console.error(
      error
    );


    setStatus(
      "Market API error"
    );


    $("content").innerHTML =
      `<div class="empty">

        Unable to load TON market.

        <br><br>

        <small>
          ${esc(
            error.message
          )}
        </small>

      </div>`;

  }finally{

    loading =
      false;

    $("refresh")
      .classList
      .remove("spin");

  }

}


/* =========================================================
   LANGUAGE
========================================================= */

function applyLanguage(){

  document.documentElement.lang =
    lang;


  document.querySelectorAll(
    "[data-tab]"
  ).forEach(
    element => {

      element.textContent =
        t(
          element.dataset.tab
        );

    }
  );


  document.querySelectorAll(
    ".nav"
  ).forEach(
    element => {

      const icon =
        element.querySelector(
          "span"
        );

      const iconHTML =
        icon
          ? icon.outerHTML
          : "";

      element.innerHTML =
        iconHTML +
        t(
          element.dataset.page
        );

    }
  );


  render();

}


/* =========================================================
   EVENTS
========================================================= */

document
  .querySelectorAll(
    "[data-tab]"
  )
  .forEach(
    element => {

      element.onclick =
        () => {

          document
            .querySelectorAll(
              ".tab"
            )
            .forEach(
              x =>
                x.classList
                 .remove("on")
            );


          element.classList
            .add("on");


          tab =
            element.dataset.tab;


          page =
            "market";


          render();

        };

    }
  );


document
  .querySelectorAll(
    "[data-tf]"
  )
  .forEach(
    element => {

      element.onclick =
        () => {

          document
            .querySelectorAll(
              "[data-tf]"
            )
            .forEach(
              x =>
                x.classList
                 .remove("on")
            );


          element.classList
            .add("on");


          tf =
            element.dataset.tf;


          render();

        };

    }
  );


document
  .querySelectorAll(
    "[data-vol]"
  )
  .forEach(
    element => {

      element.onclick =
        () => {

          document
            .querySelectorAll(
              "[data-vol]"
            )
            .forEach(
              x =>
                x.classList
                 .remove("on")
            );


          element.classList
            .add("on");


          volumeFilter =
            element.dataset.vol;


          render();

        };

    }
  );


$("refresh").onclick =
  load;


$("lang").onclick =
  () =>
    $("language")
      .classList
      .toggle("show");


document
  .querySelectorAll(
    "[data-l]"
  )
  .forEach(
    element => {

      element.onclick =
        () => {

          lang =
            element.dataset.l;

          localStorage.setItem(
            LANG_KEY,
            lang
          );

          $("language")
            .classList
            .remove("show");

          applyLanguage();

        };

    }
  );


$("close").onclick =
  () =>
    $("modal")
      .classList
      .remove("show");


$("modal").onclick =
  event => {

    if(
      event.target.id ===
      "modal"
    ){

      $("modal")
        .classList
        .remove("show");

    }

  };


$("alertClose").onclick =
  closeAlert;


$("alertCancel").onclick =
  closeAlert;


$("alertSave").onclick =
  saveAlert;


$("alertModal").onclick =
  event => {

    if(
      event.target.id ===
      "alertModal"
    ){

      closeAlert();

    }

  };


document
  .querySelectorAll(
    ".nav"
  )
  .forEach(
    element => {

      element.onclick =
        () => {

          document
            .querySelectorAll(
              ".nav"
            )
            .forEach(
              x =>
                x.classList
                 .remove("on")
            );


          element.classList
            .add("on");


          page =
            element.dataset.page;


          if(
            page ===
            "market"
          ){

            render();

          }

          else if(
            page ===
            "favorites"
          ){

            renderFavorites();

          }

          else if(
            page ===
            "alerts"
          ){

            renderAlerts();

          }

        };

    }
  );


/* =========================================================
   START
========================================================= */

applyLanguage();

load();


setInterval(
  () => {

    if(
      !loading
    ){

      load();

    }

  },
  REFRESH_MS
);

</script>
