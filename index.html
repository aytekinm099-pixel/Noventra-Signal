<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="description" content="Noventra Signal — TON Guardian market intelligence and technical signals">
<title>Noventra Signal</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#070b14;
  --card:#0f1623;
  --card2:#151e2e;
  --text:#e8eef7;
  --muted:#71809a;
  --blue:#3b82f6;
  --cyan:#22d3ee;
  --green:#10b981;
  --red:#f43f5e;
  --orange:#f59e0b;
  --purple:#8b5cf6;
  --border:rgba(59,130,246,.14);
  --glow:rgba(59,130,246,.25);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  background:#070b14 !important;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(circle at 50% -20%,rgba(37,99,235,.16),transparent 42%),
    #070b14 !important;
  color:#e8eef7 !important;
  min-height:100vh;
  padding-bottom:82px;
  line-height:1.4;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.header{
  padding:14px 14px 10px;
  background:linear-gradient(
    180deg,
    rgba(7,11,20,.99),
    rgba(7,11,20,.96)
  );
  position:sticky;
  top:0;
  z-index:40;
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(18px);
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:11px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.brand-icon{
  width:39px;
  height:39px;
  border-radius:12px;
  background:linear-gradient(135deg,#1d4ed8,#7c3aed);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  box-shadow:0 0 20px var(--glow);
  flex-shrink:0;
}

.brand h1{
  font-size:1.08rem;
  font-weight:800;
  letter-spacing:-.4px;
  color:#dbeafe;
}

.brand span{
  display:block;
  font-size:.61rem;
  color:#71809a;
  font-weight:500;
  margin-top:1px;
}

.header-actions{
  display:flex;
  gap:5px;
}

.icon-btn{
  width:35px;
  height:35px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#0f1623;
  color:#e8eef7;
  font-size:16px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.icon-btn.spin{
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.tabs{
  display:flex;
  gap:4px;
  background:#0f1623;
  padding:3px;
  border-radius:12px;
}

.tab{
  flex:1;
  text-align:center;
  padding:8px 2px;
  border-radius:9px;
  font-size:.70rem;
  font-weight:650;
  color:#71809a;
}

.tab.active{
  background:linear-gradient(135deg,#1d4ed8,#3b82f6);
  color:#fff;
  box-shadow:0 2px 12px rgba(37,99,235,.35);
}

.filters{
  display:flex;
  gap:6px;
  padding:10px 14px 0;
  overflow-x:auto;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.chip{
  flex-shrink:0;
  padding:6px 11px;
  border-radius:20px;
  font-size:.69rem;
  font-weight:550;
  background:#0f1623;
  color:#71809a;
  border:1px solid var(--border);
}

.chip.active{
  background:rgba(59,130,246,.18);
  border-color:#3b82f6;
  color:#93c5fd;
}

.status-bar{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:8px 14px 4px;
  font-size:.65rem;
  color:#71809a;
}

.status-ok{
  color:#34d399 !important;
}

.status-error{
  color:#fb7185 !important;
}

.alert-banner{
  margin:8px 12px 0;
  padding:10px 12px;
  border-radius:10px;
  background:rgba(245,158,11,.12);
  border:1px solid rgba(245,158,11,.3);
  color:#fbbf24;
  font-size:.76rem;
  display:none;
}

.alert-banner.show{
  display:block;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.list{
  padding:4px 12px 18px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.card{
  background:
    linear-gradient(
      145deg,
      rgba(15,22,35,.99),
      rgba(12,19,31,.99)
    );
  border-radius:14px;
  padding:12px 13px;
  border:1px solid var(--border);
}

.card.fav{
  border-color:rgba(129,140,248,.38);
}

.card.alert-hit{
  border-color:var(--orange);
  box-shadow:0 0 14px rgba(245,158,11,.18);
}

.card-top{
  display:flex;
  align-items:center;
  gap:9px;
}

.rank{
  width:23px;
  height:23px;
  border-radius:7px;
  background:rgba(255,255,255,.04);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:.67rem;
  font-weight:750;
  color:#71809a;
  flex-shrink:0;
}

.rank.top{
  background:rgba(59,130,246,.2);
  color:#93c5fd;
}

.info{
  flex:1;
  min-width:0;
}

.sym-row{
  display:flex;
  align-items:center;
  gap:5px;
  flex-wrap:wrap;
}

.token-title{
  display:flex;
  align-items:baseline;
  gap:5px;
  min-width:0;
  max-width:100%;
}

.token-name{
  font-weight:750;
  font-size:.91rem;
  color:#f1f5f9 !important;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  max-width:155px;
}

.token-symbol{
  font-size:.62rem;
  font-weight:650;
  color:#8da0ba !important;
  white-space:nowrap;
}

.dex{
  font-size:.56rem;
  padding:1px 5px;
  border-radius:4px;
  font-weight:650;
  text-transform:uppercase;
}

.dex.dedust{
  background:rgba(16,185,129,.15);
  color:#6ee7b7;
}

.dex.ston{
  background:rgba(59,130,246,.15);
  color:#93c5fd;
}

.dex.other{
  background:rgba(255,255,255,.06);
  color:#94a3b8;
}

.signal{
  font-size:.55rem;
  font-weight:750;
  padding:2px 5px;
  border-radius:4px;
}

.signal.strong-buy,
.signal.buy{
  background:rgba(16,185,129,.16);
  color:#34d399;
}

.signal.strong-sell,
.signal.sell{
  background:rgba(244,63,94,.16);
  color:#fb7185;
}

.signal.neutral{
  background:rgba(148,163,184,.10);
  color:#94a3b8;
}

.meta{
  font-size:.62rem;
  color:#71809a !important;
  margin-top:3px;
}

.right{
  text-align:right;
  min-width:88px;
}

.chg{
  font-weight:750;
  font-size:.97rem;
}

.chg.up{
  color:#10b981;
}

.chg.down{
  color:#f43f5e;
}

.chg.neu{
  color:#94a3b8;
}

.actions{
  display:flex;
  gap:4px;
  margin-top:3px;
  justify-content:flex-end;
}

.act-btn{
  width:26px;
  height:26px;
  border-radius:7px;
  border:1px solid var(--border);
  background:#151e2e;
  color:#94a3b8;
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.act-btn.on{
  color:#a5b4fc;
  border-color:#6366f1;
  background:rgba(99,102,241,.15);
}

.act-btn.alert-on{
  color:#f59e0b;
  border-color:#f59e0b;
  background:rgba(245,158,11,.08);
}

.tf-row{
  display:flex;
  gap:5px;
  margin-top:9px;
}

.tf{
  flex:1;
  text-align:center;
  padding:5px 2px;
  border-radius:7px;
  background:rgba(255,255,255,.025);
  font-size:.64rem;
}

.tf .lbl{
  color:#71809a;
  font-size:.56rem;
  margin-bottom:1px;
}

.tf .v.up{
  color:#10b981;
}

.tf .v.down{
  color:#f43f5e;
}

.tf .v.neu{
  color:#71809a;
}

.score-row{
  display:flex;
  justify-content:space-between;
  margin-top:7px;
  font-size:.55rem;
  color:#71809a;
}

.score-value{
  color:#93c5fd;
  font-weight:700;
}

.bar{
  height:3px;
  background:rgba(255,255,255,.05);
  border-radius:2px;
  margin-top:3px;
  overflow:hidden;
}

.bar>div{
  height:100%;
  border-radius:2px;
}

.flow-row{
  display:flex;
  justify-content:space-between;
  margin-top:6px;
  font-size:.54rem;
  color:#71809a;
}

.flow-buy{
  color:#34d399;
}

.flow-sell{
  color:#fb7185;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(12,18,32,.98);
  border-top:1px solid var(--border);
  display:flex;
  z-index:50;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  backdrop-filter:blur(18px);
}

.nav-item{
  flex:1;
  text-align:center;
  padding:6px 2px;
  font-size:.64rem;
  color:#71809a;
}

.nav-item.active{
  color:#93c5fd;
}

.nav-item .ico{
  font-size:16px;
  display:block;
  margin-bottom:2px;
}

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  z-index:100;
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.modal-bg.show{
  display:flex;
}

.modal{
  background:#111827;
  width:100%;
  max-width:430px;
  border-radius:18px 18px 0 0;
  padding:18px 16px 28px;
  border-top:1px solid var(--border);
  max-height:88vh;
  overflow-y:auto;
}

.modal h3{
  font-size:1rem;
  margin-bottom:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal label{
  display:block;
  font-size:.74rem;
  color:#71809a;
  margin-bottom:5px;
  margin-top:10px;
}

.modal input,
.modal select{
  width:100%;
  padding:11px 12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#0f1623;
  color:#e8eef7;
  font-size:.94rem;
  outline:none;
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:16px;
}

.btn{
  flex:1;
  padding:12px;
  border-radius:11px;
  font-weight:650;
  font-size:.88rem;
  cursor:pointer;
  border:none;
}

.btn-primary{
  background:linear-gradient(135deg,#1d4ed8,#3b82f6);
  color:#fff;
}

.btn-ghost{
  background:#0f1623;
  color:#94a3b8;
  border:1px solid var(--border);
}

.btn-danger{
  background:rgba(244,63,94,.15);
  color:#fb7185;
  border:1px solid rgba(244,63,94,.3);
}

.empty,
.loading{
  text-align:center;
  padding:48px 20px;
  color:#71809a;
  font-size:.86rem;
}

.loader{
  width:24px;
  height:24px;
  margin:0 auto 10px;
  border:2px solid rgba(255,255,255,.08);
  border-top-color:#3b82f6;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

.fav-empty{
  text-align:center;
  padding:42px 20px;
  color:#71809a;
}

.fav-empty .big{
  font-size:2rem;
  margin-bottom:8px;
}

.ai-body{
  font-size:.82rem;
  line-height:1.55;
  color:#dbe4f5;
  white-space:pre-wrap;
}

.language-menu{
  position:fixed;
  top:64px;
  right:10px;
  z-index:200;
  width:190px;
  background:#111827;
  border:1px solid rgba(59,130,246,.25);
  border-radius:14px;
  padding:7px;
  box-shadow:0 15px 40px rgba(0,0,0,.45);
  backdrop-filter:blur(18px);
}

.language-menu button{
  width:100%;
  border:0;
  background:transparent;
  color:#e8eef7;
  border-radius:9px;
  padding:10px;
  text-align:left;
  font-size:.82rem;
}

.language-menu button.active{
  background:rgba(59,130,246,.20);
}

.guardian-badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:.57rem;
  color:#6ee7b7;
  margin-top:2px;
}

.guardian-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#10b981;
  box-shadow:0 0 7px #10b981;
}

.version{
  font-size:.52rem;
  color:#53627a;
  margin-left:4px;
}
</style>
</head>

<body>

<header class="header">

  <div class="header-top">

    <div class="brand">

      <div class="brand-icon">◈</div>

      <div>
        <h1>Noventra Signal</h1>

        <span>
          TON · Guardian Gateway · AI Signals
        </span>

        <div class="guardian-badge">
          <span class="guardian-dot"></span>
          GUARDIAN
          <span class="version">v2</span>
        </div>

      </div>

    </div>

    <div class="header-actions">

      <button
        class="icon-btn"
        id="languageBtn"
        title="Language"
      >🌐</button>

      <button
        class="icon-btn"
        id="refreshBtn"
        title="Refresh"
      >↻</button>

    </div>

  </div>

  <div class="tabs" id="mainTabs">

    <div class="tab active" data-tab="gainers">
      Gainers
    </div>

    <div class="tab" data-tab="losers">
      Losers
    </div>

    <div class="tab" data-tab="volume">
      Volume
    </div>

    <div class="tab" data-tab="signals">
      Signals
    </div>

  </div>

</header>

<div class="alert-banner" id="alertBanner"></div>

<div class="filters" id="filters">

  <div class="chip active" data-tf="h1">
    1 Hour
  </div>

  <div class="chip" data-tf="h6">
    6 Hours
  </div>

  <div class="chip" data-tf="h24">
    24 Hours
  </div>

  <div class="chip active" data-vol="all">
    All
  </div>

  <div class="chip" data-vol="high">
    High Volume
  </div>

  <div class="chip" data-vol="dedust">
    DeDust
  </div>

</div>

<div class="status-bar">

  <span id="statusText">
    Preparing...
  </span>

  <span id="countText"></span>

</div>

<section class="page active" id="page-market">

  <div id="content">

    <div class="loading">

      <div class="loader"></div>

      <span id="loadingText">
        Connecting to Guardian...
      </span>

    </div>

  </div>

</section>

<section class="page" id="page-favorites">

  <div id="favContent"></div>

</section>

<section class="page" id="page-alerts">

  <div id="alertContent"></div>

</section>

<nav class="bottom-nav">

  <div
    class="nav-item active"
    data-page="market"
  >
    <span class="ico">📊</span>
    <span data-i18n="market">Market</span>
  </div>

  <div
    class="nav-item"
    data-page="favorites"
  >
    <span class="ico">★</span>
    <span data-i18n="favorites">Favorites</span>
  </div>

  <div
    class="nav-item"
    data-page="alerts"
  >
    <span class="ico">🔔</span>
    <span data-i18n="alerts">Alerts</span>
  </div>

</nav>

<div class="modal-bg" id="alertModal">

  <div class="modal">

    <h3>

      <span id="alertTitle">
        Set Alert
      </span>

      <span
        id="modalClose"
        style="font-size:1.2rem;cursor:pointer;color:#71809a"
      >✕</span>

    </h3>

    <div
      id="modalSymbol"
      style="font-size:.85rem;color:#22d3ee;margin-bottom:8px"
    ></div>

    <label id="alertTypeLabel">
      Alert Type
    </label>

    <select id="alertType">

      <option value="pct_up">
        When percentage rises (%)
      </option>

      <option value="pct_down">
        When percentage falls (%)
      </option>

      <option value="price_above">
        When price rises above ($)
      </option>

      <option value="price_below">
        When price falls below ($)
      </option>

    </select>

    <label id="valueLabel">
      Value
    </label>

    <input
      type="number"
      id="alertValue"
      placeholder="e.g. 10 or 0.05"
      step="any"
      inputmode="decimal"
    >

    <div class="modal-actions">

      <button
        class="btn btn-ghost"
        id="modalCancel"
      >
        Cancel
      </button>

      <button
        class="btn btn-primary"
        id="modalSave"
      >
        Save
      </button>

    </div>

  </div>

</div>

<div class="modal-bg" id="aiModal">

  <div class="modal">

    <h3>

      <span id="aiTitle">
        🤖 AI Analysis
      </span>

      <span
        id="aiModalClose"
        style="font-size:1.2rem;cursor:pointer;color:#71809a"
      >✕</span>

    </h3>

    <div
      class="ai-body"
      id="aiBody"
    ></div>

    <div class="modal-actions">

      <button
        class="btn btn-primary"
        id="aiModalOk"
      >
        OK
      </button>

    </div>

  </div>

</div>

<script>
"use strict";

/* =========================================================
   TELEGRAM
========================================================= */

const tg=window.Telegram?.WebApp||null;

if(tg){

  tg.ready();
  tg.expand();

  /*
   * Telegram'ın light theme renklerini uygulamaya aktarmıyoruz.
   * Noventra Signal kendi koyu temasını kullanıyor.
   */
  try{

    tg.setHeaderColor?.("#070b14");
    tg.setBackgroundColor?.("#070b14");
    tg.setBottomBarColor?.("#0c1220");

  }catch(_){}

}


/* =========================================================
   CONFIG
========================================================= */

const GUARDIAN_BASE=
  "https://noventraguardian.aytekinm099.workers.dev";

const GUARDIAN_MARKET=
  GUARDIAN_BASE+"/api/market";

const FAV_KEY=
  "noventra_favs_v9";

const ALERT_KEY=
  "noventra_alerts_v9";

const LANG_KEY=
  "noventra_language_v3";

const REFRESH_MS=
  60000;

const MIN_VOL=
  500;

const MIN_LIQ=
  250;

const HIGH_VOL=
  20000;

const MAX_RESULTS=
  150;

const REQUEST_TIMEOUT=
  10000;


/* =========================================================
   STORAGE
========================================================= */

const loadJSON=(key,def=[])=>{
  try{

    const raw=
      localStorage.getItem(key);

    if(!raw)return def;

    const parsed=
      JSON.parse(raw);

    return Array.isArray(parsed)
      ?parsed
      :def;

  }catch(_){

    return def;

  }
};

const saveJSON=(key,value)=>{

  try{

    localStorage.setItem(
      key,
      JSON.stringify(value)
    );

  }catch(_){}

};

let favorites=
  loadJSON(FAV_KEY,[]);

let alerts=
  loadJSON(ALERT_KEY,[]);

let pairs=[];

let currentTab=
  "gainers";

let currentTf=
  "h1";

let volFilter=
  "all";

let currentPage=
  "market";

let isLoading=
  false;

let alertTarget=
  null;

let currentLanguage=
  "en";


/* =========================================================
   I18N
========================================================= */

const LANGUAGES={
  tr:"🇹🇷 Türkçe",
  en:"🇬🇧 English",
  ru:"🇷🇺 Русский",
  zh:"🇨🇳 中文",
  ja:"🇯🇵 日本語",
  ko:"🇰🇷 한국어"
};

const I18N={

tr:{
  market:"Piyasa",
  favorites:"Favoriler",
  alerts:"Alarmlar",
  gainers:"Yükselen",
  losers:"Düşen",
  volume:"Hacim",
  signals:"Sinyaller",
  hour1:"1 Saat",
  hour6:"6 Saat",
  hour24:"24 Saat",
  all:"Tüm",
  highVolume:"Yüksek Hacim",
  dedust:"DeDust",
  preparing:"Hazırlanıyor...",
  scanning:"Guardian üzerinden TON piyasası taranıyor...",
  updated:"Güncellendi",
  pairs:"çift",
  noResults:"Bu filtrede sonuç yok.",
  refreshOrFilter:"Yenileyin veya filtreyi değiştirin.",
  dataError:"Guardian verisi alınamadı — yenileyin",
  guardianError:"Guardian verilerine erişilemiyor — sayfayı yenileyin",
  noFavorites:"Henüz favori yok.",
  addFavorite:"Piyasa sekmesinden ★ ile ekleyin.",
  noAlerts:"Aktif alarm yok.",
  setAlertShort:"Kartlardaki 🔔 ile alarm kurun.",
  alertSet:"Alarm Kur",
  alertType:"Alarm Tipi",

function detectLanguage(){

  try{

    const saved=
      localStorage.getItem(LANG_KEY);

    if(
      saved &&
      LANGUAGES[saved]
    ){
      return saved;
    }

    const code=
      (
        tg?.initDataUnsafe?.user?.language_code ||
        navigator.language ||
        "en"
      )
      .toLowerCase()
      .split("-")[0]
      .split("_")[0];

    return LANGUAGES[code]
      ?code
      :"en";

  }catch(_){

    return "en";

  }

}

const sleep=
  ms=>new Promise(r=>setTimeout(r,ms));

const clamp=
  (v,min,max)=>
    Math.max(min,Math.min(max,v));

const esc=
  v=>String(v??"")
    .replace(
      /[&<>"']/g,
      m=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m])
    );

const escJS=
  v=>String(v??"")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");

const fmtPct=
  v=>{
    v=Number(v||0);

    if(Math.abs(v)<.05){
      return "0.0%";
    }

    return (
      v>0?"+":""
    )+
    v.toFixed(1)+
    "%";
  };

const fmtMoney=
  v=>{
    v=Number(v||0);

    if(v>=1e9)
      return "$"+(v/1e9).toFixed(1)+"B";

    if(v>=1e6)
      return "$"+(v/1e6).toFixed(1)+"M";

    if(v>=1e3)
      return "$"+(v/1e3).toFixed(1)+"K";

    return "$"+Math.round(v);
  };

function formatPrice(v){

  v=Number(v||0);

  if(!v)return "0";

  if(v<1e-6)
    return v.toExponential(2);

  if(v<.01)
    return v.toFixed(6);

  if(v<1)
    return v.toFixed(4);

  if(v<100)
    return v.toFixed(3);

  return v.toFixed(2);
}

function cls(v){

  v=Number(v||0);

  if(v>.25)return "up";
  if(v<-.25)return "down";

  return "neu";
}

/* =========================================================
   GUARDIAN FETCH
========================================================= */

async function guardianFetch(
  path="/api/market"
){

  const controller=
    new AbortController();

  const timer=
    setTimeout(
      ()=>controller.abort(),
      REQUEST_TIMEOUT
    );

  try{

    const response=
      await fetch(
        GUARDIAN_BASE+path,
        {
          method:"GET",
          cache:"no-store",
          signal:controller.signal,
          headers:{
            "Accept":"application/json"
          }
        }
      );

    clearTimeout(timer);

    const text=
      await response.text();

    let data=null;

    try{

      data=
        text
          ?JSON.parse(text)
          :null;

    }catch(_){

      throw new Error(
        "Guardian returned invalid JSON"
      );

    }

    if(!response.ok){

      throw new Error(
        data?.error?.message ||
        data?.error ||
        "Guardian HTTP "+response.status
      );

    }

    return data;

  }catch(error){

    clearTimeout(timer);

    throw error;

  }

}


/* =========================================================
   MARKET RESPONSE NORMALIZER
========================================================= */

function extractMarkets(data){

  if(Array.isArray(data))
    return data;

  const candidates=[
    data?.markets,
    data?.pairs,
    data?.data?.markets,
    data?.data?.pairs,
    data?.result?.markets,
    data?.result?.pairs
  ];

  for(const item of candidates){

    if(Array.isArray(item))
      return item;

  }

  return [];

}


/* =========================================================
   NORMALIZE GUARDIAN MARKET
========================================================= */

function normalizePair(p){

  if(!p)
    return null;

  const chain=
    String(
      p.chainId ||
      p.chain ||
      p.network ||
      "ton"
    ).toLowerCase();

  if(
    chain &&
    chain!=="ton"
  ){
    return null;
  }

  const pairAddress=
    String(
      p.pairAddress ||
      p.pair_address ||
      p.address ||
      ""
    );

  if(!pairAddress)
    return null;

  const volume=
    Number(
      p.volume?.h24 ??
      p.volume24h ??
      p.volume_24h ??
      p.volume ??
      0
    );

  const liquidity=
    Number(
      p.liquidity?.usd ??
      p.liquidityUsd ??
      p.liquidity_usd ??
      p.liquidity ??
      0
    );

  if(
    volume<MIN_VOL ||
    liquidity<MIN_LIQ
  ){
    return null;
  }

  const dex=
    String(
      p.dexId ||
      p.dex ||
      p.dex_id ||
      ""
    ).toLowerCase();

  const base=
    p.baseToken ||
    p.base ||
    {};

  const quote=
    p.quoteToken ||
    p.quote ||
    {};

  const name=
    String(
      base.name ||
      base.symbol ||
      p.baseName ||
      p.name ||
      "Unknown Token"
    )
    .trim()
    .slice(0,32);

  const symbol=
    String(
      base.symbol ||
      p.baseSymbol ||
      p.symbol ||
      "???"
    )
    .trim()
    .slice(0,15);

  const buys=
    Number(
      p.txns?.h24?.buys ??
      p.buys24h ??
      p.buys ??
      0
    );

  const sells=
    Number(
      p.txns?.h24?.sells ??
      p.sells24h ??
      p.sells ??
      0
    );

  const totalTx=
    buys+sells;

  const buyRatio=
    totalTx>0
      ?buys/totalTx
      :.5;

  const flow=
    totalTx>0
      ?((buys-sells)/totalTx)*100
      :0;

  const changeSource=
    p.priceChange ||
    p.change ||
    {};

  const change={

    m5:Number(
      changeSource.m5 ??
      changeSource["5m"] ??
      0
    ),

    h1:Number(
      changeSource.h1 ??
      changeSource["1h"] ??
      0
    ),

    h6:Number(
      changeSource.h6 ??
      changeSource["6h"] ??
      0
    ),

    h24:Number(
      changeSource.h24 ??
      changeSource["24h"] ??
      0
    )

  };

  return {

    pairAddress,

    url:
      p.url ||
      p.pairUrl ||
      "",

    dexId:
      p.dexId ||
      p.dex ||
      "Unknown",

    isDedust:
      dex.includes("dedust"),

    isSton:
      dex.includes("ston"),

    baseName:name,

    baseSymbol:symbol,

    baseAddress:
      String(
        base.address ||
        p.baseAddress ||
        ""
      ),

    quoteSymbol:
      String(
        quote.symbol ||
        p.quoteSymbol ||
        ""
      )
      .trim()
      .slice(0,12),

    priceUsd:
      Number(
        p.priceUsd ??
        p.price ??
        0
      ),

    change,

    volume:{
      h24:volume
    },

    liquidity,

    txns:totalTx,

    buys,

    sells,

    buyRatio,

    flow

  };

}


/* =========================================================
   NOVENTRA SIGNAL ENGINE v2
========================================================= */

function calculateSignal(p){

  const c=p.change;

  /*
   * MOMENTUM       35%
   * TIMEFRAME      20%
   * BUY/SELL FLOW  15%
   * VOLUME         10%
   * LIQUIDITY      10%
   * ACCELERATION   10%
   */

  const momentum=
    clamp(
      c.m5*.10 +
      c.h1*.40 +
      c.h6*.30 +
      c.h24*.20,
      -100,
      100
    );


  /* TIMEFRAME */

  const directions=[
    c.m5,
    c.h1,
    c.h6,
    c.h24
  ];

  const positive=
    directions.filter(
      x=>x>0.5
    ).length;

  const negative=
    directions.filter(
      x=>x<-0.5
    ).length;

  let timeframeScore=0;

  if(positive===4){

    timeframeScore=100;

  }else if(positive===3){

    timeframeScore=70;

  }else if(
    positive===2 &&
    c.h1>0
  ){

    timeframeScore=30;

  }else if(negative===4){

    timeframeScore=-100;

  }else if(negative===3){

    timeframeScore=-70;

  }else if(
    negative===2 &&
    c.h1<0
  ){

    timeframeScore=-30;

  }


  /* BUY / SELL FLOW */

  const flow=
    Number(p.flow||0);

  const flowScore=
    clamp(
      flow*1.8,
      -100,
      100
    );


  /* VOLUME */

  const volume=
    Number(p.volume?.h24||0);

  let volumeScore=0;

  if(volume>=500000)
    volumeScore=100;
  else if(volume>=200000)
    volumeScore=80;
  else if(volume>=100000)
    volumeScore=65;
  else if(volume>=50000)
    volumeScore=50;
  else if(volume>=20000)
    volumeScore=30;
  else if(volume>=5000)
    volumeScore=10;
  else
    volumeScore=-20;


  /* LIQUIDITY */

  const liquidity=
    Number(p.liquidity||0);

  let liquidityScore=0;

  if(liquidity>=250000)
    liquidityScore=100;
  else if(liquidity>=100000)
    liquidityScore=80;
  else if(liquidity>=50000)
    liquidityScore=65;
  else if(liquidity>=20000)
    liquidityScore=45;
  else if(liquidity>=5000)
    liquidityScore=20;
  else if(liquidity>=2500)
    liquidityScore=0;
  else
    liquidityScore=-50;


  /* ACCELERATION */

  const acceleration=
    clamp(
      (c.h1-c.m5)*1.5,
      -100,
      100
    );


  /* FINAL SCORE */

  let score=
    momentum*.35 +
    timeframeScore*.20 +
    flowScore*.15 +
    volumeScore*.10 +
    liquidityScore*.10 +
    acceleration*.10;

  score=
    clamp(
      score,
      -100,
      100
    );


  /* SIGNAL */

  let signal="neutral";

  if(
    score>=65 &&
    c.h1>=3 &&
    flow>=5 &&
    positive>=2
  ){

    signal="strong-buy";

  }else if(
    score>=30 &&
    c.h1>=1 &&
    flow>=0
  ){

    signal="buy";

  }else if(
    score<=-65 &&
    c.h1<=-3 &&
    flow<=-5 &&
    negative>=2
  ){

    signal="strong-sell";

  }else if(
    score<=-30 &&
    c.h1<=-1 &&
    flow<=0
  ){

    signal="sell";

  }


  /* CONFIDENCE */

  let confidence=50;

  confidence+=
    Math.min(
      Math.abs(score)*.28,
      28
    );

  if(
    positive>=3 ||
    negative>=3
  ){
    confidence+=7;
  }

  if(volume>=50000)
    confidence+=5;

  if(liquidity>=20000)
    confidence+=5;

  if(p.txns>=100)
    confidence+=4;

  if(liquidity<2500)
    confidence-=15;

  if(volume<5000)
    confidence-=8;

  if(
    (c.h1>0&&c.h6<0) ||
    (c.h1<0&&c.h6>0)
  ){
    confidence-=8;
  }

  confidence=
    clamp(
      Math.round(confidence),
      15,
      96
    );


  /* WARNINGS */

  const warnings=[];

  if(c.h1>25)
    warnings.push(t("overheat"));

  if(c.h1<-25)
    warnings.push(t("oversold"));

  if(liquidity<2500)
    warnings.push(t("lowLiquidity"));

  if(
    volume>100000 &&
    Math.abs(c.h1)>12
  ){
    warnings.push(
      t("highVolumeMove")
    );
  }

  if(
    Math.abs(c.h1)>8 &&
    volume<5000
  ){
    warnings.push(
      t("lowVolumeMove")
    );
  }

  if(
    c.h1>5 &&
    c.h6<-5
  ){
    warnings.push(
      t("shortUpMediumWeak")
    );
  }

  if(
    c.h1<-5 &&
    c.h6>5
  ){
    warnings.push(
      t("shortDownMediumPositive")
    );
  }


  return {

    score,

    signal,

    confidence,

    warnings,

    analytics:{

      momentum,

      timeframeScore,

      flowScore,

      volumeScore,

      liquidityScore,

      acceleration,

      buyRatio:Number(
        (p.buyRatio*100).toFixed(1)
      ),

      buys:p.buys,

      sells:p.sells

    }

  };

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(){

  if(isLoading)
    return;

  isLoading=true;

  const refresh=
    document.getElementById(
      "refreshBtn"
    );

  refresh.classList.add("spin");

  setStatus(
    t("scanning")
  );

  document.getElementById(
    "loadingText"
  ).textContent=
    t("scanning");

  try{

    const data=
      await guardianFetch(
        "/api/market"
      );

    const raw=
      extractMarkets(data);

    if(!raw.length){

      throw new Error(
        "Guardian returned zero markets"
      );

    }

    const seen=
      new Set();

    const collected=[];

    for(const rawPair of raw){

      const p=
        normalizePair(
          rawPair
        );

      if(
        !p ||
        seen.has(
          p.pairAddress
        )
      ){
        continue;
      }

      seen.add(
        p.pairAddress
      );

      Object.assign(
        p,
        calculateSignal(p)
      );

      collected.push(p);

    }

    collected.sort(
      (a,b)=>
        Math.abs(b.score)-
        Math.abs(a.score)
    );

    pairs=
      collected;

    document.getElementById(
      "countText"
    ).textContent=
      pairs.length+
      " "+
      t("pairs");

    setStatus(
      t("updated")+
      ": "+
      new Date()
        .toLocaleTimeString(
          locale()
        ),
      "ok"
    );

    checkAlerts();

    render();

    renderFavorites();

    renderAlertsPage();

  }catch(error){

    console.error(
      "Noventra Signal Guardian Error:",
      error
    );

    setStatus(
      t("guardianError"),
      "error"
    );

    const content=
      document.getElementById(
        "content"
      );

    if(!pairs.length){

      content.innerHTML=`
        <div class="empty">
          <div style="font-size:2rem;margin-bottom:10px">
            ⚠️
          </div>
          ${esc(t("guardianError"))}
          <br>
          <small style="display:block;margin-top:8px">
            ${esc(
              error?.message ||
              "Guardian request failed"
            )}
          </small>
        </div>
      `;

    }

  }finally{

    isLoading=false;

    refresh.classList.remove(
      "spin"
    );

  }

}


/* =========================================================
   FILTER
========================================================= */

function getFiltered(){

  let list=[
    ...pairs
  ];

  if(volFilter==="high"){

    list=
      list.filter(
        p=>
          p.volume.h24>=
          HIGH_VOL
      );

  }

  if(volFilter==="dedust"){

    list=
      list.filter(
        p=>p.isDedust
      );

  }


  if(currentTab==="gainers"){

    list=
      list
        .filter(
          p=>
            p.change[currentTf]>1
        )
        .sort(
          (a,b)=>
            b.change[currentTf]-
            a.change[currentTf]
        );

  }else if(currentTab==="losers"){

    list=
      list
        .filter(
          p=>
            p.change[currentTf]<-1
        )
        .sort(
          (a,b)=>
            a.change[currentTf]-
            b.change[currentTf]
        );

  }else if(currentTab==="volume"){

    list.sort(
      (a,b)=>
        b.volume.h24-
        a.volume.h24
    );

  }else{

    const order={
      "strong-buy":0,
      "buy":1,
      "strong-sell":2,
      "sell":3,
      "neutral":9
    };

    list=
      list
        .filter(
          p=>
            p.signal!=="neutral"
        )
        .sort(
          (a,b)=>
            (
              order[a.signal]-
              order[b.signal]
            ) ||
            (
              Math.abs(b.score)-
              Math.abs(a.score)
            )
        );

  }

  return list.slice(
    0,
    MAX_RESULTS
  );

}

      );

      openAlertModal(p);
    else

      );

  };

function closeModal(){

  document.getElementById(
    "alertModal"
  ).classList.remove(
    "show"
  );

  alertTarget=null;

}

function saveAlert(){

  if(!alertTarget)
    return;

  const type=
    document.getElementById(
      "alertType"
    ).value;

  const value=
    parseFloat(
      document.getElementById(
        "alertValue"
      ).value
    );

  if(
    !Number.isFinite(value) ||
    value<=0
  ){

    showAlert(
      t("invalidValue")
    );

    return;

  }

  alerts=
    alerts.filter(
      a=>
        !(
          a.pairAddress===
          alertTarget.pairAddress &&
          a.type===
          type
        )
    );

  alerts.push({

    id:
      Date.now().toString(36),

    pairAddress:
      alertTarget.pairAddress,

    symbol:
      alertTarget.baseSymbol,

    name:
      alertTarget.baseName,

    type,

    value,

    url:
      alertTarget.url,

    created:
      Date.now()

  });

  saveJSON(
    ALERT_KEY,
    alerts
  );

  const sym=
    alertTarget.baseSymbol;

  closeModal();

  render();

  renderAlertsPage();

  showPopup(
    t("saved"),
    `${sym} ${t("alertCreated")}`
  );

}

function removeAlert(id){

  alerts=
    alerts.filter(
      a=>
        a.id!==id
    );

  saveJSON(
    ALERT_KEY,
    alerts
  );

  renderAlertsPage();

  render();

  checkAlerts();

}

window.removeAlert=
  removeAlert;

function checkAlerts(){

  const hits=[];

  for(
    const a of alerts
  ){

    const p=
      pairs.find(
        x=>
          x.pairAddress===
          a.pairAddress
      );

    if(!p)
      continue;

    const hit=

      (
        a.type==="pct_up" &&
        p.change.h1>=a.value
      ) ||

      (
        a.type==="pct_down" &&
        p.change.h1<=-a.value
      ) ||

      (
        a.type==="price_above" &&
        p.priceUsd>=a.value
      ) ||

      (
        a.type==="price_below" &&
        p.priceUsd<=a.value
      );

    if(hit)
      hits.push(a);

  }

  const banner=
    document.getElementById(
      "alertBanner"
    );

  if(!hits.length){

    banner.classList.remove(
      "show"
    );

    return;

  }

  banner.innerHTML=
    hits
      .map(
        a=>
          "🔔 <b>"+
          esc(a.symbol)+
          "</b> "+
          t("triggered")
      )
      .join("<br>");

  banner.classList.add(
    "show"
  );

  try{

    tg?.HapticFeedback
      ?.notificationOccurred(
        "warning"
      );

  }catch(_){}

}


/* =========================================================
   AI ANALYSIS
========================================================= */

function generateAIAnalysis(p){

  const c=p.change;

  const score=
    Number(p.score||0);

  const conf=
    Number(p.confidence||50);

  const volume=
    Number(p.volume?.h24||0);

  const liquidity=
    Number(p.liquidity||0);


  let trend;

  if(score>=70)
    trend=t("veryStrongUp");
  else if(score>=55)
    trend=t("strongUp");
  else if(score>=35)
    trend=t("positive");
  else if(score>=15)
    trend=t("slightlyPositive");
  else if(score>-15)
    trend=t("neutralTrend");
  else if(score>-35)
    trend=t("slightlyNegative");
  else if(score>-55)
    trend=t("weak");
  else if(score>-70)
    trend=t("strongDown");
  else
    trend=t("veryStrongDown");


  let volumeText;

  if(volume>=200000){

    volumeText=
      `${t("veryHighVolume")} (${fmtMoney(volume)})`;

  }else if(volume>=50000){

    volumeText=
      `${t("highVolumeText")} (${fmtMoney(volume)})`;

  }else if(volume>=15000){

    volumeText=
      `${t("mediumVolume")} (${fmtMoney(volume)})`;

  }else if(volume>=5000){

    volumeText=
      `${t("lowMediumVolume")} (${fmtMoney(volume)})`;

  }else{

    volumeText=
      `${t("veryLowVolume")} (${fmtMoney(volume)})`;

  }


  let liquidityText;

  if(liquidity>=100000){

    liquidityText=
      `${t("strongLiquidity")} (${fmtMoney(liquidity)})`;

  }else if(liquidity>=20000){

    liquidityText=
      `${t("sufficientLiquidity")} (${fmtMoney(liquidity)})`;

  }else if(liquidity>=5000){

    liquidityText=
      `${t("mediumLiquidity")} (${fmtMoney(liquidity)})`;

  }else if(liquidity>=1500){

    liquidityText=
      `${t("weakLiquidity")} (${fmtMoney(liquidity)})`;

  }else{

    liquidityText=
      `${t("criticalLiquidity")} (${fmtMoney(liquidity)})`;

  }


  const ups=[
    c.m5,
    c.h1,
    c.h6,
    c.h24
  ].filter(
    x=>x>1
  ).length;

  const downs=[
    c.m5,
    c.h1,
    c.h6,
    c.h24
  ].filter(
    x=>x<-1
  ).length;


  let tf;

  if(ups>=3)
    tf=t("multiUp");
  else if(downs>=3)
    tf=t("multiDown");
  else if(
    c.h1>5 &&
    c.h6<-3
  )
    tf=t("shortUpMediumWeak");
  else if(
    c.h1<-5 &&
    c.h6>3
  )
    tf=t("shortDownMediumPositive");
  else
    tf=t("mixed");


  const risks=[];

  if(c.h1>25)
    risks.push(
      `${fmtPct(c.h1)} 1h — ${t("overheat")}`
    );

  if(c.h1<-25)
    risks.push(
      `${fmtPct(c.h1)} 1h — ${t("oversold")}`
    );

  if(liquidity<2500)
    risks.push(
      t("lowLiquidity")
    );

  if(
    volume<5000 &&
    Math.abs(c.h1)>8
  )
    risks.push(
      t("lowVolumeMove")
    );

  if(
    c.h1>0 &&
    c.h6<-8
  )
    risks.push(
      t("shortUpMediumWeak")
    );

  if(
    c.h1<0 &&
    c.h6>10
  )
    risks.push(
      t("shortDownMediumPositive")
    );

  if(!risks.length)
    risks.push(
      t("noExtraWarnings")
    );


  let advice;

  if(
    p.signal==="strong-buy" &&
    conf>=65
  ){

    advice=
      t("adviceStrongBuy");

  }else if(
    p.signal==="buy" &&
    conf>=60
  ){

    advice=
      t("adviceBuy");

  }else if(
    p.signal==="buy"
  ){

    advice=
      t("adviceWeakBuy");

  }else if(
    p.signal==="strong-sell"
  ){

    advice=
      t("adviceStrongSell");

  }else if(
    p.signal==="sell"
  ){

    advice=
      t("adviceSell");

  }else if(
    Math.abs(score)<15
  ){

    advice=
      t("adviceNeutral");

  }else{

    advice=
      t("adviceWatch");

  }


  const s=
    score>0
      ?"+"+score.toFixed(0)
      :score.toFixed(0);


  return `

<b>${esc(p.baseName)} (${esc(p.baseSymbol)})</b>

<b>${t("general")}:</b>
${esc(trend)}

<b>${t("technical")}:</b>

• 5m: ${fmtPct(c.m5)}
• 1h: ${fmtPct(c.h1)}
• 6h: ${fmtPct(c.h6)}
• 24h: ${fmtPct(c.h24)}

<b>${t("score")}:</b>
${s} · ${esc(signalLabel(p.signal)||t("neutral"))}

<b>${t("confidence")}:</b>
${conf.toFixed(0)}%

<b>${t("timeframe")}:</b>
${esc(tf)}

<b>${t("volume")}:</b>
${esc(volumeText)}

<b>${t("liquidity")}:</b>
${esc(liquidityText)}

<b>${t("flow")}:</b>
${Number(p.flow||0)>0?"+":""}${Number(p.flow||0).toFixed(1)}%

<b>${t("warnings")}:</b>
${esc(
  (p.warnings||[]).join(" · ")||
  "—"
)}

<b>${t("risks")}:</b>
• ${risks.map(esc).join("\n• ")}

<b>${t("summary")}:</b>
${esc(advice)}

<i>${esc(t("disclaimer"))}</i>

`;

}

function openLanguageMenu(){

  let menu=
    document.getElementById(
      "languageMenu"
    );

  if(menu){

    menu.remove();

    return;

  }

  menu=
    document.createElement(
      "div"
    );

  menu.id=
    "languageMenu";

  menu.className=
    "language-menu";


  Object.entries(
    LANGUAGES
  ).forEach(
    ([code,name])=>{

      const button=
        document.createElement(
          "button"
        );

      button.textContent=
        name;

      if(
        code===
        currentLanguage
      ){

        button.classList.add(
          "active"
        );

      }

      button.onclick=()=>{

        setLanguage(
          code
        );

        menu.remove();

      };

      menu.appendChild(
        button
      );

    }
  );


  document.body.appendChild(
    menu
  );

}

              );

            chip.classList.add(
              "active"
            );

            volFilter=
              chip.dataset.vol;

          }

          render();

        }
      );

    }
  );


document
  .querySelectorAll(
    ".nav-item"
  )
  .forEach(
    item=>{

      item.addEventListener(
        "click",
        ()=>{

          document
            .querySelectorAll(
              ".nav-item"
            )
            .forEach(
              x=>
                x.classList.remove(
                  "active"
                )
            );

          item.classList.add(
            "active"
          );

          currentPage=
            item.dataset.page;

          document
            .querySelectorAll(
              ".page"
            )
            .forEach(
              x=>
                x.classList.remove(
                  "active"
                )
            );

          document
            .getElementById(
              "page-"+
              currentPage
            )
            .classList.add(
              "active"
            );


          const market=
            currentPage===
            "market";

          document.getElementById(
            "filters"
          ).style.display=
            market
              ?"flex"
              :"none";

          document.getElementById(
            "mainTabs"
          ).style.display=
            market
              ?"flex"
              :"none";


          if(
            currentPage===
            "favorites"
          )
            renderFavorites();

          if(
            currentPage===
            "alerts"
          )
            renderAlertsPage();

          if(market)
            render();

        }
      );

    }
  );


document.getElementById(
  "refreshBtn"
).onclick=
  loadData;


document.getElementById(
  "modalClose"
).onclick=
  closeModal;


document.getElementById(
  "modalCancel"
).onclick=
  closeModal;


document.getElementById(
  "modalSave"
).onclick=
  saveAlert;


document.getElementById(
  "alertModal"
).onclick=
  event=>{

    if(
      event.target.id===
      "alertModal"
    ){

      closeModal();

    }

  };


document.getElementById(
  "aiModalClose"
).onclick=
  closeAIModal;


document.getElementById(
  "aiModalOk"
).onclick=
  closeAIModal;


document.getElementById(
  "aiModal"
).onclick=
  event=>{

    if(
      event.target.id===
      "aiModal"
    ){

      closeAIModal();

    }

  };


/* =========================================================
   START
========================================================= */

document.documentElement.lang=
  currentLanguage;

applyLanguage();

loadData();

setInterval(
  ()=>{
    if(!isLoading)
      loadData();
  },
  REFRESH_MS
);

</script>

</body>
</html>
