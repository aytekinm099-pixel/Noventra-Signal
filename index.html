<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#070b14"><title>Noventra Signal</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#070b14;--card:#101827;--card2:#151f30;--text:#e8eef7;--muted:#73819a;--blue:#3b82f6;--cyan:#22d3ee;--green:#10b981;--red:#f43f5e;--orange:#f59e0b;--border:rgba(59,130,246,.14)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(circle at 50% -20%,rgba(37,99,235,.18),transparent 42%),var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:72px}.header{position:sticky;top:0;z-index:20;padding:13px;background:rgba(7,11,20,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#1d4ed8,#7c3aed);display:grid;place-items:center;font-size:20px}.brand b{display:block;font-size:16px}.brand small{color:var(--muted);font-size:10px}.actions{display:flex;gap:6px}.icon{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text)}.tabs{display:flex;gap:4px;margin-top:11px;background:var(--card);padding:3px;border-radius:12px}.tab{flex:1;text-align:center;padding:8px 2px;border-radius:9px;color:var(--muted);font-size:11px;font-weight:700}.tab.on{background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:white}.filters{display:flex;gap:6px;overflow:auto;padding:10px 12px 4px}.chip{white-space:nowrap;border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:20px;padding:6px 10px;font-size:11px}.chip.on{color:#bfdbfe;border-color:#3b82f6;background:rgba(59,130,246,.16)}.status{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;padding:5px 13px}.list{padding:5px 12px 18px;display:grid;gap:8px}.card{background:linear-gradient(145deg,#101827,#0d1522);border:1px solid var(--border);border-radius:14px;padding:12px}.row{display:flex;align-items:center;gap:9px}.rank{width:24px;height:24px;border-radius:7px;background:#182235;color:var(--muted);display:grid;place-items:center;font-size:10px;font-weight:800}.info{flex:1;min-width:0}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sym{font-size:10px;color:var(--muted);margin-left:5px}.meta{color:var(--muted);font-size:9px;margin-top:3px}.right{text-align:right}.chg{font-size:15px;font-weight:800}.up{color:var(--green)}.down{color:var(--red)}.neutral{color:var(--muted)}.badges{display:flex;gap:4px;margin-top:5px;justify-content:flex-end}.badge{font-size:8px;padding:3px 5px;border-radius:5px;background:rgba(255,255,255,.06);color:var(--muted)}.buy{background:rgba(16,185,129,.15);color:#34d399}.sell{background:rgba(244,63,94,.15);color:#fb7185}.buttons{display:flex;gap:4px;margin-top:8px}.btn{flex:1;border:1px solid var(--border);background:var(--card2);color:var(--muted);border-radius:8px;padding:7px;font-size:11px}.btn.ai{color:#93c5fd;border-color:rgba(59,130,246,.3)}.tf{display:flex;gap:4px;margin-top:9px}.tf div{flex:1;background:rgba(255,255,255,.025);border-radius:7px;padding:5px 2px;text-align:center;font-size:9px}.tf small{display:block;color:var(--muted);font-size:8px}.score{margin-top:7px;color:var(--muted);font-size:9px;display:flex;justify-content:space-between}.bar{height:3px;background:rgba(255,255,255,.05);border-radius:2px;margin-top:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(12,18,32,.97);border-top:1px solid var(--border);display:flex;padding:6px 8px}.nav{flex:1;text-align:center;color:var(--muted);font-size:10px;padding:5px}.nav.on{color:#93c5fd}.nav span{display:block;font-size:16px}.empty,.loading{text-align:center;color:var(--muted);padding:50px 20px}.spin{display:inline-block;width:24px;height:24px;border:2px solid rgba(255,255,255,.1);border-top-color:var(--blue);border-radius:50%;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none;align-items:flex-end}.modalbg.show{display:flex}.modal{width:100%;max-width:520px;margin:auto auto 0;background:#111827;border-radius:18px 18px 0 0;padding:18px 16px 28px;max-height:88vh;overflow:auto;border-top:1px solid var(--border)}.modal h3{margin:0 0 12px;display:flex;justify-content:space-between}.ai{font-size:13px;line-height:1.55;color:#dbe4f5}.ai h4{margin:14px 0 5px;color:#93c5fd}.pill{display:inline-block;padding:4px 7px;border-radius:6px;background:rgba(59,130,246,.14);color:#93c5fd;font-size:10px;margin:2px}.danger{color:#fb7185}.good{color:#34d399}.language{position:fixed;right:10px;top:62px;z-index:50;background:#111827;border:1px solid var(--border);border-radius:12px;padding:6px;display:none}.language.show{display:block}.language button{display:block;width:160px;border:0;background:none;color:var(--text);text-align:left;padding:9px;border-radius:8px}
</style></head>
<body>
<header class="header"><div class="top"><div class="brand"><div class="logo">◈</div><div><b>Noventra Signal</b><small>TON · Guardian AI · Gemini</small></div></div><div class="actions"><button class="icon" id="lang">🌐</button><button class="icon" id="refresh">↻</button></div></div><div class="tabs"><div class="tab on" data-tab="gainers">Gainers</div><div class="tab" data-tab="losers">Losers</div><div class="tab" data-tab="volume">Volume</div><div class="tab" data-tab="signals">Signals</div></div></header>
<div class="filters"><button class="chip on" data-tf="h1">1 Hour</button><button class="chip" data-tf="h6">6 Hours</button><button class="chip" data-tf="h24">24 Hours</button><button class="chip on" data-vol="all">All</button><button class="chip" data-vol="high">High Volume</button><button class="chip" data-vol="dedust">DeDust</button></div>
<div class="status"><span id="status">Preparing...</span><span id="count"></span></div><main id="content"><div class="loading"><i class="spin"></i><br>Scanning TON market...</div></main>
<nav class="bottom"><div class="nav on" data-page="market"><span>📊</span>Market</div><div class="nav" data-page="favorites"><span>★</span>Favorites</div><div class="nav" data-page="alerts"><span>🔔</span>Alerts</div></nav>
<div class="language" id="language"><button data-l="en">🇬🇧 English</button><button data-l="tr">🇹🇷 Türkçe</button><button data-l="ru">🇷🇺 Русский</button><button data-l="zh">🇨🇳 中文</button><button data-l="ja">🇯🇵 日本語</button><button data-l="ko">🇰🇷 한국어</button></div>
<div class="modalbg" id="modal"><div class="modal"><h3><span>🤖 Noventra Guardian AI</span><span id="close" style="cursor:pointer">✕</span></h3><div id="ai" class="ai"><div class="loading"><i class="spin"></i><br>Guardian AI is analyzing...</div></div></div></div>
<script>
"use strict";
const tg=window.Telegram?.WebApp||null;if(tg){tg.ready();tg.expand()}
const API="https://noventrasignal.aytekinm099.workers.dev";
const FAV="noventra_signal_favs_v9",ALERT="noventra_signal_alerts_v9",LANG="noventra_signal_lang_v3";
let pairs=[],tab="gainers",tf="h1",vol="all",page="market",loading=false,lang=localStorage.getItem(LANG)||"en";
const $=id=>document.getElementById(id),num=v=>Number.isFinite(Number(v))?Number(v):0,esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
const money=v=>{v=num(v);if(v>=1e9)return"$"+(v/1e9).toFixed(1)+"B";if(v>=1e6)return"$"+(v/1e6).toFixed(1)+"M";if(v>=1e3)return"$"+(v/1e3).toFixed(1)+"K";return"$"+Math.round(v)};
const pct=v=>{v=num(v);return(v>0?"+":"")+v.toFixed(1)+"%"};
const fmt=v=>{v=num(v);if(v<1e-6&&v>0)return v.toExponential(2);if(v<.01&&v>0)return v.toFixed(6);if(v<1&&v>0)return v.toFixed(4);return v.toFixed(v<100?3:2)};
const cls=v=>v>.25?"up":v<-.25?"down":"neutral";
const getJSON=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}};
let favorites=getJSON(FAV,[]),alerts=getJSON(ALERT,[]);
const TX={en:{market:"Market",favorites:"Favorites",alerts:"Alerts",gainers:"Gainers",losers:"Losers",volume:"Volume",signals:"Signals",scan:"Scanning TON market...",updated:"Updated",no:"No results",ai:"Guardian AI",analyzing:"Guardian AI is analyzing...",confidence:"Confidence",reason:"Reasoning",risks:"Risk flags",bull:"Bull case",bear:"Bear case",action:"Action",summary:"Summary",liquidity:"Liquidity",volume24:"24h Volume",watch:"WATCH",buy:"BUY",sell:"SELL",strongbuy:"STRONG BUY",strongsell:"STRONG SELL"},tr:{market:"Piyasa",favorites:"Favoriler",alerts:"Alarmlar",gainers:"Yükselen",losers:"Düşen",volume:"Hacim",signals:"Sinyaller",scan:"TON piyasası taranıyor...",updated:"Güncellendi",no:"Sonuç yok",ai:"Guardian AI",analyzing:"Guardian AI analiz ediyor...",confidence:"Güven",reason:"Nedenler",risks:"Riskler",bull:"Yükseliş senaryosu",bear:"Düşüş senaryosu",action:"Aksiyon",summary:"Özet",liquidity:"Likidite",volume24:"24s Hacim",watch:"İZLE",buy:"AL",sell:"SAT",strongbuy:"GÜÇLÜ AL",strongsell:"GÜÇLÜ SAT"},ru:{market:"Рынок",favorites:"Избранное",alerts:"Оповещения",gainers:"Рост",losers:"Падение",volume:"Объём",signals:"Сигналы",scan:"Сканирование TON...",updated:"Обновлено",no:"Нет результатов",ai:"Guardian AI",analyzing:"Guardian AI анализирует...",confidence:"Уверенность",reason:"Причины",risks:"Риски",bull:"Бычий сценарий",bear:"Медвежий сценарий",action:"Действие",summary:"Итог",liquidity:"Ликвидность",volume24:"Объём 24ч",watch:"НАБЛЮДАТЬ",buy:"ПОКУПКА",sell:"ПРОДАЖА",strongbuy:"СИЛЬНАЯ ПОКУПКА",strongsell:"СИЛЬНАЯ ПРОДАЖА"},zh:{market:"市场",favorites:"收藏",alerts:"提醒",gainers:"上涨",losers:"下跌",volume:"成交量",signals:"信号",scan:"正在扫描 TON 市场...",updated:"更新",no:"没有结果",ai:"Guardian AI",analyzing:"Guardian AI 正在分析...",confidence:"置信度",reason:"原因",risks:"风险",bull:"看涨情景",bear:"看跌情景",action:"行动",summary:"总结",liquidity:"流动性",volume24:"24小时成交量",watch:"观察",buy:"买入",sell:"卖出",strongbuy:"强力买入",strongsell:"强力卖出"},ja:{market:"市場",favorites:"お気に入り",alerts:"アラート",gainers:"上昇",losers:"下落",volume:"出来高",signals:"シグナル",scan:"TON市場をスキャン中...",updated:"更新",no:"結果なし",ai:"Guardian AI",analyzing:"Guardian AI が分析中...",confidence:"信頼度",reason:"理由",risks:"リスク",bull:"強気シナリオ",bear:"弱気シナリオ",action:"アクション",summary:"概要",liquidity:"流動性",volume24:"24h出来高",watch:"監視",buy:"買い",sell:"売り",strongbuy:"強い買い",strongsell:"強い売り"},ko:{market:"시장",favorites:"즐겨찾기",alerts:"알림",gainers:"상승",losers:"하락",volume:"거래량",signals:"시그널",scan:"TON 시장 스캔 중...",updated:"업데이트",no:"결과 없음",ai:"Guardian AI",analyzing:"Guardian AI 분석 중...",confidence:"신뢰도",reason:"이유",risks:"위험",bull:"상승 시나리오",bear:"하락 시나리오",action:"액션",summary:"요약",liquidity:"유동성",volume24:"24시간 거래량",watch:"관찰",buy:"매수",sell:"매도",strongbuy:"강력 매수",strongsell:"강력 매도"}};
const t=k=>(TX[lang]||TX.en)[k]||TX.en[k]||k;
function setStatus(x){$("status").textContent=x}
async function get(path,opts={}){const r=await fetch(API+path,{...opts,headers:{Accept:"application/json",...(opts.headers||{})}});const d=await r.json().catch(()=>({ok:false,error:"Invalid JSON"}));if(!r.ok||d.ok===false)throw new Error(d.error||"Request failed");return d}
function normalize(p){return{...p,change:p.change||{},volume:p.volume||{h24:0},liquidity:num(p.liquidity),score:num(p.score),confidence:num(p.confidence)}}
async function load(){if(loading)return;loading=true;setStatus(t("scan"));try{const d=await get("/api/market");pairs=(d.pairs||[]).map(normalize);$("count").textContent=pairs.length+" pairs";setStatus(t("updated")+": "+new Date().toLocaleTimeString());render()}catch(e){console.error(e);setStatus("Market API error");$("content").innerHTML='<div class="empty">Unable to load TON market.<br><small>'+esc(e.message)+'</small></div>'}finally{loading=false}}
function filtered(){let a=[...pairs];if(vol==="high")a=a.filter(p=>num(p.volume.h24)>=20000);if(vol==="dedust")a=a.filter(p=>p.isDedust);if(tab==="gainers")a=a.filter(p=>num(p.change[tf])>1).sort((a,b)=>num(b.change[tf])-num(a.change[tf]));else if(tab==="losers")a=a.filter(p=>num(p.change[tf])<-1).sort((a,b)=>num(a.change[tf])-num(b.change[tf]));else if(tab==="volume")a.sort((a,b)=>num(b.volume.h24)-num(a.volume.h24));else a=a.filter(p=>p.signal&&p.signal!=="neutral").sort((a,b)=>Math.abs(num(b.score))-Math.abs(num(a.score)));return a.slice(0,150)}
function fav(a){return favorites.some(x=>x.pairAddress===a)}
function toggleFav(p){favorites=fav(p.pairAddress)?favorites.filter(x=>x.pairAddress!==p.pairAddress):[...favorites,{pairAddress:p.pairAddress,symbol:p.baseToken?.symbol,name:p.baseToken?.name,url:p.url}];localStorage.setItem(FAV,JSON.stringify(favorites));render()}
function signalText(s){return s==="strong-buy"?t("strongbuy"):s==="buy"?t("buy"):s==="strong-sell"?t("strongsell"):s==="sell"?t("sell"):"WATCH"}
function card(p,i){const c=num(p.change[tf]),s=num(p.score),sig=p.signal||"neutral";return `<div class="card"><div class="row"><div class="rank">${i+1}</div><div class="info"><div class="name">${esc(p.baseToken?.name||"Unknown Token")} <span class="sym">${esc(p.baseToken?.symbol||"???")}</span></div><div class="meta">${esc(p.dexId||"DEX")} · ${money(p.liquidity)} ${t("liquidity")} · ${money(p.volume?.h24)} ${t("volume24")}</div></div><div class="right"><div class="chg ${cls(c)}">${pct(c)}</div><div class="badges"><span class="badge ${sig.includes("buy")?"buy":sig.includes("sell")?"sell":""}">${esc(signalText(sig))}</span></div></div></div><div class="tf"><div><small>5m</small><span class="${cls(p.change?.m5)}">${pct(p.change?.m5)}</span></div><div><small>1h</small><span class="${cls(p.change?.h1)}">${pct(p.change?.h1)}</span></div><div><small>6h</small><span class="${cls(p.change?.h6)}">${pct(p.change?.h6)}</span></div><div><small>24h</small><span class="${cls(p.change?.h24)}">${pct(p.change?.h24)}</span></div></div><div class="score"><span>Noventra Score</span><b>${s>0?"+":""}${s.toFixed(0)} · ${num(p.confidence).toFixed(0)}%</b></div><div class="bar"><i style="width:${Math.min(100,Math.abs(s))}%"></i></div><div class="buttons"><button class="btn" onclick="toggleFav(pairs[${pairs.indexOf(p)}])">${fav(p.pairAddress)?"★":"☆"} Favorite</button><button class="btn ai" onclick="openAI(${pairs.indexOf(p)})">🤖 ${t("ai")}</button><button class="btn" onclick="openPair('${esc(p.url||"")}')">↗ DEX</button></div></div>`}
function render(){if(page!=="market")return;const a=filtered();$("content").innerHTML=a.length?'<div class="list">'+a.map(card).join("")+"</div>":'<div class="empty">'+t("no")+'</div>'}
function openPair(u){if(!u)return;try{tg?.openLink?tg.openLink(u):window.open(u,"_blank")}catch{window.open(u,"_blank")}}
async function openAI(i){const p=pairs[i];if(!p)return;$("modal").classList.add("show");$("ai").innerHTML='<div class="loading"><i class="spin"></i><br>'+t("analyzing")+'</div>';try{let guardian={};try{guardian=await get("/api/guardian/"+encodeURIComponent(p.baseToken?.address||p.pairAddress))}catch(e){guardian={error:e.message}}const body={token:{name:p.baseToken?.name,symbol:p.baseToken?.symbol,address:p.baseToken?.address,priceUsd:p.priceUsd},market:{pairAddress:p.pairAddress,dex:p.dexId,priceUsd:p.priceUsd,change:p.change,volume24h:p.volume?.h24,liquidityUsd:p.liquidity,score:p.score,signal:p.signal,confidence:p.confidence},guardian};const d=await get("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});showAI(d.analysis,p)}catch(e){$("ai").innerHTML='<div class="empty">AI analysis failed.<br><small>'+esc(e.message)+'</small></div>'}}
function showAI(a,p){const arr=x=>Array.isArray(x)?x:[];$("ai").innerHTML=`<div><span class="pill">${esc(a.signal||"WATCH")}</span><span class="pill">${t("confidence")}: ${num(a.confidence)}%</span></div><h4>${esc(a.headline||p.baseToken?.name||"Token")}</h4><p>${esc(a.marketState||"")}</p><h4>${t("reason")}</h4><ul>${arr(a.reasoning).map(x=>"<li>"+esc(x)+"</li>").join("")}</ul><h4>Timeframes</h4><p><b>Short:</b> ${esc(a.timeframes?.short||"—")}</p><p><b>Medium:</b> ${esc(a.timeframes?.medium||"—")}</p><p><b>Long:</b> ${esc(a.timeframes?.long||"—")}</p><h4>${t("liquidity")}</h4><p>${esc(a.liquidityView||"—")}</p><h4>${t("volume24")}</h4><p>${esc(a.volumeView||"—")}</p><h4>${t("risks")}</h4><ul>${arr(a.riskFlags).map(x=>"<li class=\"danger\">"+esc(x)+"</li>").join("")||"<li>—</li>"}</ul><h4>${t("bull")}</h4><p>${esc(a.bullCase||"—")}</p><h4>${t("bear")}</h4><p>${esc(a.bearCase||"—")}</p><h4>${t("action")}</h4><p><span class="pill">${esc(a.action||"WATCH")}</span></p><h4>${t("summary")}</h4><p>${esc(a.summary||"—")}</p>`}
function applyLang(){document.documentElement.lang=lang;document.querySelectorAll("[data-tab]").forEach(x=>x.textContent=t(x.dataset.tab));document.querySelectorAll(".nav").forEach(x=>{const k=x.dataset.page;x.innerHTML=x.querySelector("span")?.outerHTML+(t(k)||k)});document.querySelectorAll("[data-l]").forEach(x=>x.classList.toggle("on",x.dataset.l===lang));render()}
document.querySelectorAll("[data-tab]").forEach(x=>x.onclick=()=>{document.querySelectorAll(".tab").forEach(y=>y.classList.remove("on"));x.classList.add("on");tab=x.dataset.tab;render()});document.querySelectorAll("[data-tf]").forEach(x=>x.onclick=()=>{document.querySelectorAll("[data-tf]").forEach(y=>y.classList.remove("on"));x.classList.add("on");tf=x.dataset.tf;render()});document.querySelectorAll("[data-vol]").forEach(x=>x.onclick=()=>{document.querySelectorAll("[data-vol]").forEach(y=>y.classList.remove("on"));x.classList.add("on");vol=x.dataset.vol;render()});$("refresh").onclick=load;$("close").onclick=()=>$("modal").classList.remove("show");$("modal").onclick=e=>{if(e.target.id==="modal")$("modal").classList.remove("show")};$("lang").onclick=()=>$("language").classList.toggle("show");document.querySelectorAll("[data-l]").forEach(x=>x.onclick=()=>{lang=x.dataset.l;localStorage.setItem(LANG,lang);$("language").classList.remove("show");applyLang()});document.querySelectorAll(".nav").forEach(x=>x.onclick=()=>{document.querySelectorAll(".nav").forEach(y=>y.classList.remove("on"));x.classList.add("on");page=x.dataset.page;if(page!=="market"){$("content").innerHTML='<div class="empty">'+(page==="favorites"?"★ Favorites":"🔔 Alerts")+'<br><small>Use the Market tab to manage them.</small></div>'}else render()});applyLang();load();setInterval(()=>{if(!loading)load()},60000);
</script></body></html>
